# Fixed architecture policy for synchronization (E14/GOV-001). Not an operator file.
# Source rules: SpikeGLX session control and alignment scope: SYS-004, E04, E09, E12, E14.
# Change only with the governing architecture decision, then bump policy_version
# here and in config/backends/synchronization_config.toml. The loader rejects a version mismatch.
policy_version = 5

[alignment]
execution = "external_posthoc"
authority = "spikeglx_recorded_hardware_pulses"

[spikeglx]
control_owner = "controller_sdk_client"
control_scope = "run_name_start_stop"
controller_loss = "no_remote_stop_emergency_report_names_run_for_manual_stop"
stop_timing = "local_stopped_deadline_plus_stop_margin_or_immediate_without_trial"
paired_recording_policy = "required_before_first_trial"
writing_evidence = "saving_and_stream_sample_count_progress"
active_failure_policy = "classify_e06_incident_operator_decision_when_continuable"
monitor_rule = "any_saved_stream_no_advance_or_saving_off_or_run_changed_or_counter_reset_opens_incident"
link_loss_policy = "treated_as_no_confirmed_advance"
progress_deadline_origin = "each_saved_stream_last_confirmed_sample_advance"
unpaired_setup = "warn_and_log_no_prompt"
native_file_finalization = "delegated_to_spikeglx"
acquisition_configuration_owner = "operator_in_spikeglx"
recording_interval = "session"
transfer = "manual_after_recording"
