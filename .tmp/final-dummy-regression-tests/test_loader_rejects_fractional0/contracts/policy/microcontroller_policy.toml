# Fixed controller-owned Microcontroller declarations. A11/E14.
policy_version = 1

[microcontroller]
firmware_target_scope = "rig_board_first"
firmware_installation = "explicit_configuration_upload"
firmware_upload_tool = "arduino_cli"
firmware_upload_board = "arduino:avr:uno"
firmware_upload_image = "intel_hex_application"
firmware_upload_source = "arduino_sketch_or_compiled_image"
firmware_source_max_bytes = 8388608
firmware_source_max_entries = 256
firmware_upload_verify = true
firmware_upload_cleanup_reserve_ns = 2000000000
boot_behavior = "outputs_off_require_configuration"
command_format = "newline_ascii"
acknowledgement = "after_application_with_state"
argument_style = "named_fields"
output_field_names = "camera_roles"
text_field_limits = "message_bound_only"
field_values = "tokens_and_numbers"
request_ids = "connection_id_counter"
request_id_format = "combined_field"
error_code_format = "symbolic"
unmatched_reply = "discard_keep_deadline"
port_resolution = "configured_only"
reconnect_preparation = "outputs_off_fresh_configuration"
startup_readiness = "bounded_read_only_probes"
connection_reset = "no_deliberate_extra_reset"
stop_priority = "before_unsent_requests"
boundary_scheduling = "reserve_before_scheduled_commands"
trial_boundary_timing = "host_dispatch_at_trial_boundaries"
stop_budget_validation = "outstanding_request_off_camera_and_report"
trial_boundary_commands = "grouped_active_outputs"
first_pulse = "immediate_on_application"
stop_behavior = "immediate_inactive"
pulse_polarity = "active_high"
inactive_level = "low"
protocol_compatibility = "exact_version"
protocol_version = 3
capability_source = "firmware"
capability_query = "CAPS"
capability_reply = "single_bounded_reply"
capability_refresh = "connection_and_setup"
pin_identifier_format = "firmware_token"
unknown_command_fields = "reject_command"
max_outstanding_requests = 1
serial_channel = "protocol_only"
max_line_bytes = 512
frequency_format = "decimal_hz"
frequency_resolution_hz = 0.1
configuration_handshake = "configure_apply_report"
configuration_record_owner = "host_requested_and_applied"
frequency_quantization = "nearest_achievable_report_applied"
frequency_adjustment = "warn_without_confirmation"
frequency_readback_precision = "preserve_reported_frequency"
configuration_update = "complete"
disabled_output_fields = "enabled_only"
configuration_while_running = "stop_apply_restore_running"
keepalive_reply = "compact_status"
status_reply = "state_and_applied_configuration"
pulse_counters = false
diagnostic_edge_counts = "input_observed_output_generated"
watchdog_status_clear = "successful_configuration"
command_timeout_action = "report_without_retry"
pulse_generation = "microcontroller"
pulse_scheduler = "hardware_timer"
clock_source = "local"
duty_cycle = 0.5
communication_loss_action = "stop_pulses"
output_mapping = "per_camera"

