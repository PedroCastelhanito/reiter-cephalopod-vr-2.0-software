# Fixed architecture policy for experiment (E14/GOV-001). Not an operator file.
# Source rules: Experiment controller defaults. See architecture.md: E05, E06, E07, E08, E14.
# Change only with the governing architecture decision, then bump policy_version
# here and in config/backends/experiment_config.toml. The loader rejects a version mismatch.
policy_version = 8

# Shared physical GPU placement, owned by SYS-002; no ordinal is a stable identity.
[gpu_placement]
render_projection_tracking = "nvidia_geforce_rtx_5060_ti"
video_encoding = "nvidia_geforce_rtx_2080_ti"
operator_display_gui = "amd_radeon_ryzen_9_9950x_integrated"
automatic_adapter_fallback = true

[state_delivery]
configuration_values = "snapshot_and_stream_revision_change"

[protocol]
minimum_trial_duration_s = 60

[recording_interval]
interruption_cutoff = "producer_local_admission_stop"
file_integrity_validation = "external_post_hoc"

[host_clock]
clock_id = "cephvr.host.perf_counter_ns.v1"
python_api = "time.perf_counter_ns"
origin = "system_wide_unshifted"
unit = "ns"

[runtime_incidents]
continuable_failure = "operator_continue_or_abort"
while_pending = "continue_original_timeline"
blocking_failure = "automatic_stop_and_inform"
continuation_scope = "isolated_function_loss_no_restart_or_protocol_change"

[control_lease]
liveness = "exact_live_watch_subscription"
disconnection = "release_invalidate_generation"
reconnection = "observer_automatic_unheld_claim_explicit_takeover"
cli = "acquire_execute_release"

[metadata]
writer_owner = "controller_serialized_background_thread"
output_reservation_owner = "controller_local_lock_and_marker"
completion = "local_event_after_sync"
uncertain_write = "no_retry_or_takeover"

[configuration_validation]
commit = "only_after_successful_current_validation"
unavailable_or_timeout = "reject_warn_preserve_current"
invalid_values = "reject_with_field_issues_preserve_current"
late_result = "never_commit_after_expiry_or_state_change"
history = "single_current_configuration_no_rollback"

[recovery]
missed_deadline = "single_state_query_within_shared_recovery_budget"

[incident_history]
reconnect_warnings = "snapshot_retained_bounded_no_history_rpc"

[trial_command_delivery]
max_transport_retries = 1

[defaults]
engineering_limits = "configurable_workload_checked_starting_values"
scientific_and_rig_inputs = "explicit_no_fabricated_values"
