# Tracking defaults. See architecture.md: E10, E14, A04, A06, T01–T12, T14–T45.
format_version = 1
# E14: fixed policy lives in contracts/policy/tracking_policy.toml; versions must match.
policy_version = 42

[backend]
# E10: new-configuration default; saved choices win. Presence does not enable tracking.
enabled = false

[recording]
# T14: independent session setting; saved false wins; inactive tracking writes nothing.
save_tracking_data = true
# T19/E14: file-only engineering starting limits; readiness checks the workload.
sync_interval_s = 1
write_progress_timeout_s = 10
max_pending_records = 4_096
max_pending_bytes = 16_777_216
max_record_bytes = 262_144

[rpc]
# T08/E08: startup-only loopback endpoint; restart required after edits.
port = 50055

[frames]
# A04 pre-processing frame-age limit (host receipt to processing start); not an
# acquisition-to-Visual Stimulus or display-latency bound. Ring capacity lives in acquisition_config.
max_frame_age_ms = 250

[results]
# A06 tracking-result queue capacity, independent of camera-frame ring capacity.
capacity_results = 10

[pipeline]
# T02/T04: water_flow or fin_flow. Default water_flow (as current CephVR); saved
# values win. Independent method schemas live in contracts/tracking/.
name = "water_flow"

[input]
# T03: camera_role selects one acquisition-owned camera: behavioral or tracking.
# No camera-role default is selected. Setup resolves the configured role to its device.
# camera_role = <selected camera role>

[pose]
# T05: manual or automatic. Default manual; no runtime fallback between modes.
mode = "manual"
# T06: keypoint_model or threshold_contour. Default threshold_contour (as current
# CephVR); it still requires the rig-specific [pose.threshold] and [pose.contour] values.
automatic_method = "threshold_contour"
# T09: maximum source-host-receipt pose age at movement evaluation. Engineering default
# (current CephVR's 30-frame limit); tune on the rig.
max_age_ms = 500
history_capacity = 8
# T10: manual requires tip/left_base/right_base x_px/y_px and source dimensions.
# T21 maps those keys to posterior, left anterior and right anterior mantle tips.
# See contracts/tracking/pose.md; no landmark defaults are supplied.
# T11: pre-exported model assets and adapter settings remain unset; deployment
# format/runtime are fixed policy, not operator selectors.

# T07 NVIDIA Optical Flow is fixed in the policy file, not an operator selector.
# Model assets/tuning remain unset. T40/T41 fix the initial water-flow family and
# screening method; explicit estimator tuning, calibration and gains require operator inputs.
# Unknown/missing required selections fail validation.

# T16: automatic mode requires an explicit rectangle within the acquired image.
# pose.search_region fields: x_px, y_px, width_px, height_px (integer pixels).
# Coordinates remain unset; full image is valid when explicitly configured.
# T17 selection/scoring is fixed policy; numerical quality values remain unset.

[pose.threshold]
# T18: required only for automatic threshold_contour; values remain unset.
# level = <finite intensity in the prepared grayscale effective-code range>
# polarity = <dark or bright>

# T20: pose.subject_reference holds image_width_px/image_height_px plus named
# anterior/posterior/medial_left/medial_right points, each with x_px/y_px.
# Enter in Configuration against manual camera preview; Setup only validates.
# No numerical defaults. Camera/layout changes require annotation revalidation.
# This is a reference annotation, not a replacement for live pose observations.

[pose.model]
# Required for keypoint_model, mapped to ModelSettings in method_models.py.
# manifest.relative_path = <manifest JSON path under E07 asset_root>
# device_ordinal = <nonnegative CUDA device ordinal, verified against physical identity>
# minimum_candidate_score = <0..1; unused zero-score rows are always excluded>
# minimum_landmark_score = <0..1>
# geometry_quality: minimum_axis_px, minimum_base_width_px,
# minimum_triangle_area_px2; explicit positive values.

[pose.contour]
# T06: ContourSettings v2; no default. Axis shape separation before tip extraction.
# minimum_axis_anisotropy = <finite (0,1]; (largest-smallest)/(largest+smallest) eigenvalue>
# Required for threshold_contour, alongside pose.threshold; ContourSettings.
# minimum_area_px2 = <positive foreground pixel count>
# maximum_area_px2 = <at least minimum, within search image bounds>
# geometry_quality uses the same explicit positive fields as pose.model.

[flow]
# Only when the accepted pipeline requires flow. No alternate provider selector.
# Engineering defaults; Setup verifies them against the actual device.
device_ordinal = 0            # Verified against the physical GPU identity.
output_grid_px = 4            # 1, 2 or 4, if supported by the device.
preset = "slow"               # slow, medium or fast (current CephVR uses slow).
temporal_hints = false
output_cost = false           # Transient quality only, never dense recording.

[limits]
# File-only engineering limits, required for enabled tracking. Include all live stage
# buffers/geometry/model working storage; device compatibility still requires Setup.
max_document_bytes = 16_777_216
max_asset_bytes = 536_870_912
max_native_bytes = 536_870_912
maximum_message_bytes = 1_048_576
pose_progress_timeout_s = 5
movement_progress_timeout_s = 5

[geometry]
# T25: initial three-point ellipse implementation. Saved values override this default.
front_fraction = 0.60
# T26: clipping is logged per section; coverage is gated once by T44 (no separate
# minimum_visible_fraction).
# T28: sampling shape; current CephVR values. taper in (-1,1), positive widens the
# posterior side; squareness positive (2 with taper 0 is a plain ellipse).
taper = 0.4
squareness = 3.5
# T29/T30: uniform Euclidean band; fractions of left/right anterior mantle-tip
# separation. Starting values; tune on the rig.
inner_clearance_fraction = 0.1
outer_extent_fraction = 0.75
# T31: full band; no geometry-sector settings.
# T30: width follows anterior-posterior; height follows left-right; both rotate
# with the body. EllipseSettings v2 binds these full-band geometry settings.
# Numeric shape/band values above are engineering defaults; saved values win.
# T24 directional offsets retain their longitudinal/lateral span conventions.

# T27: method selections resolve through the installed typed stage catalogue.
# Built-in tables above are convenience mappings to their implementation settings;
# canonical session configuration stores one stages entry per active stage.
# Alternative methods are added through registration; none are fabricated here.

[estimator.sections]
# T32: downstream estimator partitioning; not a geometry-stage crop or flow reduction.
count = 12  # Current CephVR sector count; positive integer.
# Embedded in WaterFlowSettings / FinFlowSettings; no independent stage.

[estimator.support]
# T44: SectionFlowSupportSettings; accepted flow area / intended (pre-clip) section
# area, for every section. Starting value in (0,1]; tune on the rig.
minimum_accepted_area_fraction = 0.25

[estimator.smoothing]
# T45: ExponentialSmoothingSettings; one session-locked time constant for all channels.
# ~ current CephVR's 2 Hz base low-pass (1 / (2*pi*2 Hz)).
time_constant_s = 0.08

[estimator.fin_region]
# T04 F1A: fin_flow only; strict FinRegionSettings, no default angles.
# offset_degrees = <finite [-180,180), zero anterior, positive toward animal-left>
# span_degrees = <finite (0,360]; 360 selects the complete band>
# Water-flow rejects active fin_region settings. Geometry/sections/support/smoothing
# are resolved independently for the selected fin configuration; no copied water tuning.
# No fin-undulation measurement selector or wave-history settings are included.

[estimator.quality]
# T41/W1A/W2A: LocalMedianSettings; standard normalized-median-test starting values.
radius_cells = 1                  # Square half-width on the native grid (3x3).
minimum_neighbors = 4             # <= (2*radius_cells+1)^2-1.
noise_floor_px = 0.1              # Acquired-image displacement pixels.
maximum_normalized_residual = 2.0 # Dimensionless threshold.
# maximum_native_cost = <optional integer 0..255; requires flow.output_cost=true>
# Omission of cost limit resolves to explicit JSON null (no cost screening).

unknown_algorithm = true
