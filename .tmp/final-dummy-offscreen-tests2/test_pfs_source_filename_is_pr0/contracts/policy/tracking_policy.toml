# Tracking policy and current supported implementations (E14/T27). Not an operator file.
# Method choices are replaceable baselines, not permanent scientific conclusions.
# Source rules: Tracking defaults. See architecture.md: E10, E14, A04, A06, T01–T12, T14–T45.
# Change only with the governing architecture decision, then bump policy_version
# here and in config/backends/tracking_config.toml. The loader rejects a version mismatch.
policy_version = 43

[frames]
pixel_processing = "shared_methods_in_consumer"
bit_depth_policy = "preserve_source_effective_depth"
representation = "method_rgb_or_grayscale"
delivery = "ordered"
camera_gap_action = "reset_on_next_valid"
delay_action = "reset_to_latest"
overflow_action = "reset_to_latest"
delay_measure = "host_monotonic_frame_age"

[results]
delivery = "ordered"
overflow_action = "drop_old_and_reset_delivery_preserve_processing"
reset_signal = "reset_generation_on_every_result_no_separate_marker"
reset_generation_order = "monotonic_per_attachment_stream"
credit_identity = "feedback_entry_sequence"

# T02–T11/T12/T04: concrete declarations in contracts/tracking/pipeline_catalogue.py.
[pipeline]
composition = "named_pipeline_shared_stages"
supported_ids = ["water_flow", "fin_flow"]
selection_scope = "session"
implementation_version = "2"

[input]
source_scope = "single_acquisition_camera"
selection_scope = "session"

[pose]
supported_modes = ["manual", "automatic"]
supported_automatic_methods = ["keypoint_model", "threshold_contour"]
selection_scope = "session"
automatic_mode_fallback = "none"
manual_geometry = "fixed_for_session"
landmarks = ["tip", "left_base", "right_base"]
automatic_scheduling = "independent_latest_completed_pose_geometry"
history_reset_scope = "trial_source_preparation"
pending_images = "replace_waiting_keep_inflight"
invalid_or_stale_action = "invalidate_dependent_movement"
search_area = "fixed_session_rectangle"
candidate_selection = "highest_score_after_quality_checks"
threshold_segmentation = "fixed_brightness_and_polarity"
subject_reference = "four_labelled_configuration_points"
annotation_editing = "configuration_manual_preview_setup_validation_only"
# T21 labels follow the existing landmarks list in order; no new operator selector.
landmark_meanings = ["posterior_mantle_tip", "left_anterior_mantle_tip", "right_anterior_mantle_tip"]
# T22 applies only to automatic mode; manual_geometry remains fixed above.
automatic_geometry_update = "position_orientation_and_dimensions_from_same_eligible_pose"

# T07: fixed initial method; no operator selector until another method is justified.
[flow]
method = "nvidia_optical_flow"
automatic_fallback = "none"
adapter = "nvof_cuda_v1"
input_mapping = "declared_full_range_gray8_v1"
output_representation = "short2_s10_5_input_pixel_displacement"
input_format = "grayscale8"
input_buffers = "reuse_previous_and_current"
readback = "native_grid_once_per_pair_to_host"

[execution]
process_layout = "single_process_internal_workers"
movement_delivery = "ordered"
movement_worker = "prepare_flow_borrow_geometry_estimate_filter_publish"
automatic_geometry_owner = "pose_worker_exact_observation"
preparation_device = "cpu"
estimator_device = "cpu"
cpu_libraries = ["numpy", "opencv"]
private_storage = "bounded_immutable_leases"
geometry_cache = "exact_pose_layout_settings_trial_source_preparation"
preview_handoff = "optional_private_copy_without_control_buffer_retention"

# T11: fixed deployment stack; no runtime selector in operator configuration.
[pose_model]
format = "onnx"
runtime = "onnxruntime"
execution_provider = "CUDAExecutionProvider"
export_scope = "external_before_setup"
adapter = "onnx_triplet_v1"
preprocessing = "declared_full_range_letterbox_bilinear"
preprocessing_device = "cpu"
output_handoff = "bounded_candidate_tensor_to_cpu"

# T14/T15: save switch itself belongs to operator configuration.
[recording]
save_scope = "independent_session_switch"
content = "compact_scientific_records"
format = "json_lines"
file_suffix = "_tracking.jsonl"
durability = "periodic_os_sync_and_final_sync"
crash_state = "valid_to_last_complete_line"
recovery = "none_readers_discard_incomplete_final_line"
writer = "single_internal_thread"

# T06/T17/T18 concrete deterministic contour mechanics.
[pose_contour]
components = "foreground_8_connected"
score = "foreground_pixel_area"
boundary = "external_simple_chain"
clipped_component = "ineligible"
orientation = "foreground_mask_principal_moments"
axis_sign = "setup_anatomical_references"
landmarks = "posterior_and_anterior_side_boundary_extremes"
settings_schema_id = "tracking.contour-settings.v2"
implementation_version = "2"

# T23–T31: current geometry implementation; tuning values belong to operator config.
[geometry]
reference_shape = "three_landmark_2d_ellipse"
region_distance_units = "relative_measured_landmark_dimensions"
clipping = "log_per_section_gate_once_in_estimator_support"
sampling_outline = "tapered_superellipse"
band_construction = "euclidean_distance_transform"
distance_metric = "isotropic_acquired_image_pixels"
geometry_libraries = ["numpy", "opencv"]
rasterization = "body_predicate_at_pixel_centres"
distance_transform = "opencv_dist_l2_mask_precise"
band_distance_reference = "anterior_tip_separation"
region_layout = "full_band"
sectioning_owner = "downstream_runtime_estimator"
outline_axes = "body_following_width_longitudinal_height_lateral"
implementation_id = "three_point_ellipse"
implementation_version = "2"
settings_schema_id = "tracking.ellipse-settings.v2"

# T32: initial downstream estimator method, replaceable under T27.
[sectioning]
method = "equal_arc_length"
reference_outline = "tapered_superellipse"
pixel_assignment = "nearest_outline_location"
origin = "posterior_outline_endpoint"
traversal = "toward_animal_left"
boundary_rule = "half_open_normalized_arc_intervals"
tie_rule = "lowest_normalized_arc_coordinate"
# Fixed numerical accuracy checks, not biological tuning or operator defaults.
numerics_revision = 1
outline_error_px = 0.01
perimeter_relative_error = 0.0001

# T33/T34: estimator input guarantees; no operator mode selectors.
[estimator_input]
samples = "all_available_provider_grid_samples_in_band"
# T33: declared coordinate convention; not an arithmetic mean of pixel flow.
sample_position = "represented_block_centre"
sample_value = "native_block_estimate"
preaggregation = "none"
spatial_subsampling = "none"
preprocessing_motion_compensation = "none"
pose_delivery = "separate_selected_pose_with_lineage"

# T20/T35–T38: calibrated output boundary; pixel-space intermediates remain below.
[locomotion_output]
meaning = "relative_control_not_physical_swimming_velocity"
channels = ["forward_drive", "sideways_drive", "turn_drive"]
coordinate_frame = "anatomical_body"
positive_directions = ["anterior", "animal_left", "turn_toward_animal_left"]
visual_stimulus_gain_owner = "existing_stimulus_feedback_bindings"
quantity = "interval_average_rate"
visual_stimulus_control = "virtual_speed_over_valid_source_interval"
normalization = "none_direct_declared_method_units"
camera_scale = "required_valid_acquired_image_endpoints_and_known_mm"
translation_unit = "mm/s"
turning_unit = "deg/s"
unit_conversion = "filtered_translation_divide_pixels_per_mm_turn_radians_to_degrees"

# T39: evidence semantics for the current water-flow method, not a pipeline default.
[water_flow]
evidence = "visible_water_tracer_motion"
input_scope = "dense_available_provider_grid"
inference_target = "relative_planar_swimming_intent"
# T40–T45: complete settings/evidence and composition are declared under T12.
estimator_family = "flow_transport_turning_proxy"

# T42/T43: method-intrinsic averaging, not an extra output normalization layer.
[water_flow.response]
translation = "opposite_area_weighted_mean_velocity"
turning = "opposite_centred_moment_over_centred_second_moment"
turning_reference = "accepted_area_weighted_sample_centroid"
translation_unit = "px/s"
turning_unit = "1/s"

# T41: inside the selected estimator, after the full measured-input handoff.
[water_flow.quality]
method = "native_validity_and_normalized_local_median"
provider_cost = "only_when_available_and_configured"
rejected_sample_action = "exclude_without_replacement"
measured_buffer_mutation = "none"
neighborhood = "fixed_native_grid_square_excluding_self"
boundary = "eligible_selected_roi_only_no_padding"
minimum_support_failure = "sample_unevaluable"
iteration = "single_pass_original_eligibility"
residual = "component_median_absolute_residual_plus_displacement_noise_floor"
combination = "euclidean_normalized_component_residuals"

# T44/T45: fixed behavior; fraction and time constant are operator settings.
[water_flow.support]
required_regions = "every_equal_arc_section"
coverage = "accepted_flow_area_over_intended_section_area"
failure_action = "invalidate_complete_estimate"

[water_flow.smoothing]
method = "source_time_first_order_exponential"
output = "filtered_interval_average_rate"
initialization = "seed_from_current_valid_raw_estimate"
invalid_or_gap_action = "clear_history_no_output"

# T04: explicit F1A/F2A reuse; referenced water policies have one owning definition.
[fin_flow]
sampling_geometry = "shared_ellipse_derived_roi"
evidence = "visible_fin_tissue_motion"
selection = "body_frame_angular_wedge"
sectioning = "retain_full_outline_equal_arc_labels"
estimator_family = "flow_transport_turning_proxy"
response_policy_ref = "water_flow.response"
quality_policy_ref = "water_flow.quality"
smoothing_policy_ref = "water_flow.smoothing"
required_regions = "every_section_with_intended_selected_support"
coverage = "accepted_flow_area_over_intended_selected_section_area"
interpretation = "experimental_relative_fin_motion_control"

[extensions]
method_commitment = "replaceable_initial_implementations"
registration = "explicit_typed_stage_registry"
selection_scope = "before_setup_session_locked"
