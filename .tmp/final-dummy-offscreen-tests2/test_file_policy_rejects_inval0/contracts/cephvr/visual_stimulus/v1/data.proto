syntax = "proto3";
package cephvr.visual_stimulus.v1;
import "cephvr/control/v1/types.proto";

message FeedbackValue {
  string channel_id = 1;
  double value = 2;
}
enum FeedbackValidity {
  FEEDBACK_VALIDITY_UNSPECIFIED = 0;
  FEEDBACK_VALIDITY_VALID = 1;
  FEEDBACK_VALIDITY_BASELINE_ONLY = 2;
  FEEDBACK_VALIDITY_INVALID = 3;
}
message FeedbackResult {
  cephvr.control.v1.ProcessIdentity source = 1;
  cephvr.control.v1.WorkContext work = 2;
  string stream_id = 3;
  // A06: canonical decimal positive uint64, strictly increasing per attachment/stream.
  // A newer value is the reset: Visual Stimulus discards older pending results, needs a fresh baseline.
  string reset_generation = 4;
  string result_id = 5;
  uint64 result_sequence = 6;
  string newest_source_frame_id = 7;
  int64 source_host_receipt_ns = 8;
  optional int64 interval_start_ns = 9;
  optional int64 interval_end_ns = 10;
  repeated string source_frame_ids = 11;
  FeedbackValidity validity = 12;
  repeated FeedbackValue values = 13;
  string reason = 14;
}
message FeedbackEntry {
  optional uint64 entry_sequence = 3; // Positive identity for credits; attachment/stream scoped.
  FeedbackResult result = 1; // Required.
  reserved 2;
  reserved "reset"; // A06: a newer result reset_generation is the reset; no separate entry.
}
message FeedbackCredit {
  string attachment_generation = 1;
  string stream_id = 2;
  string reset_generation = 3;
  reserved 4;
  reserved "result_sequence";
  optional uint64 entry_sequence = 5; // Exact FeedbackEntry.
  // Returned once per entry when dequeued into the finite batch or discarded.
  // Retired-generation credits never replenish the current generation.
}
