# SpikeGLX session control and alignment scope: SYS-004, E04, E09, E12, E14.
# Operator settings; controller client and other hardware mappings remain pending.
format_version = 1
# E14: fixed policy lives in contracts/policy/synchronization_policy.toml; versions must match.
policy_version = 5

[backend]
# E10/E12: SpikeGLX pairing default for a new configuration. Edit to change the
# default; each session can still switch pairing On/Off and saved choices win.
enabled = true

[spikeglx]
# E12: command server reached from the rig over the dedicated Ethernet link on 2026-10-05.
address = "169.254.240.108"
port = 4142
# Installation requirement to verify: the server listens only on the dedicated
# link and the ephys firewall admits only the rig's address.

[pulse_inventory]
# E12: alignment role -> SpikeGLX saved channel. Edit freely to reassign a role;
# reread at each Setup (no restart). One channel/bit per role; no two roles share one.
# Camera trigger roles must use stream = "onebox". channel = saved acquisition channel
# index in that stream; bit = digital line within the channel, only for a digital word.
# behavioral_camera = { stream = "onebox", stream_index = 0, channel = <index>, bit = <line> }
# tracking_camera   = { stream = "onebox", stream_index = 0, channel = <index>, bit = <line> }
# photodiode        = { stream = "<onebox|ni|imec>", stream_index = <n>, channel = <index> }

[monitor]
# E14 operational starting values; validate native call and finalization relationships
# at Setup. These are failure-detection budgets, not measured hardware latency.
native_call_timeout_s = 1
writing_start_timeout_s = 5
observation_interval_s = 1
no_progress_timeout_s = 10
# The per-stream no-progress budget includes buffering/link loss; call/reconnect
# success alone never resets it. It must exceed observation_interval_s.
# Shared health/setup/cleanup bounds keep their existing owners.
# E12: extra recording time after the last trial's local Stopped deadline before
# stopRun, so SpikeGLX captures the final projector/photodiode transition. Applies only
# at session end. Nonnegative seconds, exact ns; engineering default, tune on the rig.
# Setup checks stop allowance + margin + 3 native-call budgets fit within finalization.
stop_margin_s = 1
