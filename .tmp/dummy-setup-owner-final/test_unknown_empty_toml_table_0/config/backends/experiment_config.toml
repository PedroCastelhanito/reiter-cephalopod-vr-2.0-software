# Experiment controller defaults. See architecture.md: E05, E06, E07, E08, E14.
# Durations ending in _s are seconds; _ms means milliseconds.
# Change control timing/timeouts only in this owning file before Setup (E05/E06/E14).
# GUI/headless session values and trial protocols cannot override them.
# Distinct operation values remain independently configurable here.
# Shared health lives in supervisor_config.toml; this file owns central metadata bounds.
format_version = 1
# E14: fixed policy lives in contracts/policy/experiment_policy.toml; versions must match.
policy_version = 8

[assets]
# E07: asset_root is the configurable base directory for relative media references.
# It may be on another disk. No directory default has been selected; leave unset.
# Saved/operator values take precedence. The resolved root is shared with backends.
# This does not set the recording output directory.

[rpc]
# E08: fixed controller service port; bind only to loopback interfaces.
# Clients use this definition. Report conflicts instead of selecting another port.
port = 50051
# E08: one gRPC max message size for every CephVR client/server, read at startup
# (restart to change). Pending event/metadata byte budgets must each fit at least
# four maximum messages; counts and required-evidence admission still apply.
max_message_bytes = 16_777_216

[control]
# Control is released on WatchState stream loss; GUI reconnect claims unheld control
# after synchronization and warning acknowledgement. Takeover remains explicit.

# E03/E08: reconnect warnings come from the Snapshot's retained errors/incidents/
# recoveries for the current Setup/session. At this bound evict the oldest resolved
# entries first and mark coverage truncated; active incidents are never evicted.
max_retained_incidents = 256

# Exact command admission and completion records support idempotent retries. Every
# participant retains active-work records and uses this post-finalization duration.
# The cache is volatile and is not copied into session or emergency reports.
command_record_retention_after_finalization_s = 300

[event_queue]
# Incoming controller control events, separate from retained incidents above.
# Enforce whichever limit is reached first. Bytes count serialized payloads,
# not total Python process memory. Scientific streams do not enter this queue.
# E08: reject new ordinary commands on overload; preserve interruption handling.
# Essential evidence that cannot be admitted blocks/interrupts execution.
max_pending_events = 1_024
max_pending_payload_bytes = 67_108_864

[timeouts]
# E06: one shared recovery budget. When any initial deadline below expires, freeze
# the missing set and query each once (GetState/GetRetainedResult) within this
# budget, then fail. gRPC channels reconnect on their own; no extra reconnect step.
recovery_s = 10

[timeouts.setup]
initial_s = 60

[timeouts.setup_cancel]
# One shared cleanup deadline for all participants in the cancelled Setup attempt.
initial_s = 10

[timeouts.trial_ready]
initial_s = 10

[timeouts.trial_finished]
# Closure may drain samples from the trial interval; it never extends that interval.
initial_s = 30

[timeouts.supervisor_registration]
# Before Setup Ready, at Start and on session-level updates; not per trial.
# Wait for matching registered context; generic command acceptance is insufficient.
initial_s = 5

[configuration_validation]
# E07: total local configuration-module validation deadline, including queueing.
# Use shared pure Python validators outside the controller state loop; no RPC required.
# Unavailable/incompatible/timed-out validation rejects edits with a warning and
# preserves current settings/revision. No deferred edit or automatic rollback.
# Session device/asset checks remain in Setup; V19 startup display validation is separate.
timeout_s = 5

[configuration_history]
# E07: total deadline from submission, including queueing and the atomic save.
# This is separate from required session/trial metadata persistence.
# On failure, interactive closure offers Retry / Close without saving.
# Unattended shutdown reports the failure and completes graceful shutdown.
save_timeout_s = 5

[storage]
# Query only during Setup. Timeout means Space unknown with Continue/Cancel.
space_query_timeout_s = 5
# E04: warn below 10 decimal GB; Continue never overrides a confirmed storage error.
low_space_warning_bytes = 10_000_000_000

[protocol]
# Fill each unspecified intertrial gap with this value. Each gap remains independent.
# No extra gap before the first trial or after the last; in-trial epochs are separate.
default_intertrial_gap_s = 0

# Schedule/Release transport retry count is fixed in experiment_policy.toml (E05).

[timing]
# E05: after all trial gates pass, schedule the target this far ahead.
# Loaded during Setup and fixed for the session; no recording during this allowance.
start_lead_time_ms = 500

# All required target acknowledgements collected and release dispatched by T - this.
controller_release_cutoff_before_start_ms = 100
# Each required backend has received/validated release AND the controller has
# received all valid release acknowledgements by T - this. One shared cutoff.
backend_release_cutoff_before_start_ms = 50
# Require lead time > controller cutoff offset > backend cutoff offset > 0.
# Dispatch release as soon as all gates pass; cutoffs are deadlines, not added waits.

# Start lateness covers actual software start and the first expected current-trial
# camera callback/returned Visual Stimulus presentation call per required output (software only;
# no photodiode feedback on the rig) under one host-observed liveness
# tolerance after T (E05), including controller receipt of valid Started evidence.
# Configure here before Setup; session-locked at Start. T remains the boundary.
# After early interruption, reports still describe activity inside the actual interval.
start_lateness_tolerance_ms = 250

# Valid Stopped evidence must reach the controller (its ingress time counts) within
# this allowance after the normal end or issuance of an early interruption.
# Delivery time counts; missing evidence flags stopping as unconfirmed while cleanup
# continues. This allowance never extends recording; closure has its own timeout.
stop_report_timeout_ms = 250

[metadata]
# Accepted-but-not-yet-synchronized work, including the active write, is bounded
# by both operation count and total serialized payload size. Admission fails at
# whichever limit would be exceeded first; entries are never dropped or replaced.
max_pending_operations = 256
max_pending_bytes = 67_108_864
# Total queue + write/append + flush + sync time for each required metadata operation.
# Expiry leaves persistence unconfirmed: no uncertain-write retry or writer takeover.
completion_timeout_s = 5


[unsupported_empty_section]
