syntax = "proto3";
package cephvr.tracking.v1;

// T19: file-only settings resolved by controller; session edits cannot override.
// Required when tracking saving is enabled. Every scalar requires presence.
message TrackingRecordingSettings {
  optional double sync_interval_s = 1; // Positive finite, exact positive int64 ns.
  optional double write_progress_timeout_s = 2; // Positive finite, exact int64 ns.
  optional uint32 max_pending_records = 3; // Positive; includes in-flight writer work.
  optional uint64 max_pending_bytes = 4; // Positive; all retained record buffers.
  optional uint32 max_record_bytes = 5; // Positive; one serialized UTF-8 JSON line, excluding LF.
}
