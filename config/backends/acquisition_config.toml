# Camera/acquisition defaults. See architecture.md: E10, E14, A01-A05, A07-A11.
# Camera serials/rates are owner-assigned below; other rig bindings remain incomplete. A02 owns process layout.
format_version = 1
# E14: fixed policy lives in contracts/policy/acquisition_policy.toml; versions must match.
policy_version = 19

[rpc]
# Fixed acquisition service endpoint; loopback-only, shared by all its clients.
# Configurable with application restart; report conflicts instead of choosing another.
# Internal worker endpoints remain OS-assigned and registered separately.
port = 50053

[cameras]
# Adapter maps SDK names; actual exposure/gain/ROI values remain unset.

[cameras.behavioral]
device_id = "40065509"
pulse_frequency_hz = 30.0
# Owner-assigned 2026-09-29. Saved-setting ResultingFrameRate estimate: 29.29630 Hz.
# Saved Bayer8 payload needs 368640000 B/s at 30 Hz, above its enabled 360000000 limit.
# Meet 30 Hz through explicit later settings and rig checks; never silently reduce it.
# A10: 4096 x 3000 is the initial candidate if it covers the required field of view.
# Confirm ROI/offsets before assigning values; full-width recording needs explicit
# compatible HEVC settings and rig verification, not an automatic recording crop.
# File-only post_cutoff_drain_margin_ms: set for active capture before Setup.
# Must cover confirmed exposure + rig transport/SDK delivery bound + one frame period.
# Rig-specific value intentionally unset; unknown does not mean zero.
# Independently configurable SDK image-buffer pool; validate before session locking.
# Additional to recording/tracking rings and working copies; no growth while running.
# Initial value awaits rig verification; this is not a bound on all driver/device RAM.
sdk_buffer_count = 10
microcontroller_pin = "D10"
# The owner assigned D10 on 2026-10-05; pulse frequency remains the saved 30 Hz.
# Use a distinct output pin per camera on the shared microcontroller connection.
# Electrical trigger and preview behavior still require rig verification.
# Configurable per camera before the session: external_trigger or free_running.
# External input source/line must be explicitly configured for the rig.
frame_timing = "external_trigger"
# A10/E12: free_running requires true here; the camera is then unaligned to SpikeGLX.
unaligned_free_running = false
# External-trigger defaults; preserve explicit saved/PFS/operator values and validate.
# Adapter maps these names to SDK features; timed duration is separate from auto/manual.
trigger_selector = "frame_start"
trigger_activation = "rising_edge"
exposure_duration_mode = "timed"
# Active-trial silence after first usable frame; invalid images do not reset it.
# The separate 250 ms first-frame deadline remains unchanged.
frame_silence_timeout_s = 1
enabled = true
save_video = true
# device_id above is the owner-confirmed camera serial.
# Assignment changes require fresh Setup.

# Independent complete encoding list for this camera; no shared-list inheritance.
# Initial accepted baseline; edit this list without changing the other camera.
# RTX 2080 Ti probe rejected 4112-wide H.264; 4096-wide initialization passed.
# Revalidate final dimensions/depth; do not infer a selected ROI from this baseline.
# Output options only; encoding defaults live here, not in architecture policy.
# Default YUV 4:4:4, full range, BT.709 matrix; all configurable in this list.
# The scale filter converts range/matrix without resizing; output tags must agree.
# Explicit format plus +pix_fmt disables implicit conversion/fallback.
# This does not assign calibrated color primaries/transfer or apply display gamma.
# Optional recording_bit_depth = 8 or 10; intentionally unset, not defaulted to 8.
# Absence preserves source precision; deeper-source reduction requires explicit consent.
# yuv444p is 8-bit: deeper sources need recording_bit_depth = 8 for this list,
# or recording_bit_depth = 10 with compatible 10-bit format/codec arguments.
# Setup blocks and explains source/target-depth or codec/format incompatibility.
# Acknowledgement cannot bypass it; no automatic downgrade/fallback.
ffmpeg_args = [
  "-c:v", "h264_nvenc",
  "-pix_fmt", "+yuv444p",
  "-vf", "scale=w=iw:h=ih:in_range=full:out_range=full:out_color_matrix=bt709,format=pix_fmts=yuv444p",
  "-color_range", "pc",
  "-colorspace", "bt709",
  "-preset", "p4",
  "-rc", "vbr",
  "-cq", "18",
  "-b:v", "0",
  "-rc-lookahead", "0",
]

[cameras.tracking]
device_id = "40747103"
pulse_frequency_hz = 60.0
# Owner-assigned 2026-09-29. Resolution and source/recording depth remain unset.
# File-only post_cutoff_drain_margin_ms: set for active capture before Setup.
# Must cover confirmed exposure + rig transport/SDK delivery bound + one frame period.
# Rig-specific value intentionally unset; unknown does not mean zero.
# Independently configurable SDK image-buffer pool; validate before session locking.
# Additional to recording/tracking rings and working copies; no growth while running.
# Initial value awaits rig verification; this is not a bound on all driver/device RAM.
sdk_buffer_count = 10
microcontroller_pin = "D11"
# The owner assigned D11 on 2026-10-05; pulse frequency remains the saved 60 Hz.
# Use a distinct output pin per camera on the shared microcontroller connection.
# Electrical trigger and preview behavior still require rig verification.
# Configurable per camera before the session: external_trigger or free_running.
# External input source/line must be explicitly configured for the rig.
frame_timing = "external_trigger"
# A10/E12: free_running requires true here; the camera is then unaligned to SpikeGLX.
unaligned_free_running = false
# External-trigger defaults; preserve explicit saved/PFS/operator values and validate.
# Adapter maps these names to SDK features; timed duration is separate from auto/manual.
trigger_selector = "frame_start"
trigger_activation = "rising_edge"
exposure_duration_mode = "timed"
# Active-trial silence after first usable frame; invalid images do not reset it.
# The separate 250 ms first-frame deadline remains unchanged.
frame_silence_timeout_s = 1
enabled = false
# Configurable before the session; preserve explicit saved false values.
# This default has no recording effect while the tracking camera is disabled.
save_video = true
# device_id above is confirmed; complete other required settings before enabling.

# Independent complete encoding list for this camera; no shared-list inheritance.
# Initial accepted baseline; edit this list without changing the other camera.
# Output options only; encoding defaults live here, not in architecture policy.
# Default YUV 4:4:4, full range, BT.709 matrix; all configurable in this list.
# The scale filter converts range/matrix without resizing; output tags must agree.
# Explicit format plus +pix_fmt disables implicit conversion/fallback.
# This does not assign calibrated color primaries/transfer or apply display gamma.
# Optional recording_bit_depth = 8 or 10; intentionally unset, not defaulted to 8.
# Absence preserves source precision; deeper-source reduction requires explicit consent.
# yuv444p is 8-bit: deeper sources need recording_bit_depth = 8 for this list,
# or recording_bit_depth = 10 with compatible 10-bit format/codec arguments.
# Setup rejects mismatches/unsupported capabilities; no automatic downgrade/fallback.
ffmpeg_args = [
  "-c:v", "h264_nvenc",
  "-pix_fmt", "+yuv444p",
  "-vf", "scale=w=iw:h=ih:in_range=full:out_range=full:out_color_matrix=bt709,format=pix_fmts=yuv444p",
  "-color_range", "pc",
  "-colorspace", "bt709",
  "-preset", "p4",
  "-rc", "vbr",
  "-cq", "18",
  "-b:v", "0",
  "-rc-lookahead", "0",
]

[cameras.behavioral.transport]
# Optional exact SDK parameter names with native scalar values/units.
# Only supported transport parameters; rig-specific override values remain unset.
# Separate from camera image features and ffmpeg_args.
# DeviceLinkThroughputLimitMode and DeviceLinkThroughputLimit are supported mappings.
# Select values after ROI/precision; the advertised maximum is not validated headroom.

[cameras.tracking.transport]
# Independent optional transport overrides; no inheritance from behavioral.


[buffers]
# A03: seqlock tracking ring (shared memory) and in-process recording queue.
# The capture thread never waits; a lapped tracking read skips, a full recording
# queue drops its oldest waiting frame (A04).
tracking_ring_frames = 10
recording_queue_frames = 10
# A03: optional; the recording queue grows to ceil(frame_rate_hz x allowance_ms / 1000)
# frames, minimum recording_queue_frames. Not needed for encoder start-up (A08 launches
# FFmpeg before T); available for sizing other bursts. Unset.
# recording_startup_allowance_ms = <positive integer>

[recording]
# A07 frame log (<prefix>_<role>_cam_frames.jsonl); schema in
# contracts/acquisition/frame_log_schema.toml. No HDF5.
# Per camera: frame records waiting for append (capture -> recording thread). Exhaustion
# is a logging failure that fences the recording path; never silently lose records.
pending_records_capacity = 10000
# Frame-log OS sync cadence; also at closure. Not a maximum-loss window and does not
# set the video sync cadence.
sync_interval_s = 1

[recording.encoding]
# Exact tool baseline version pins remain unset until selected/verified.
# Shared configurable fragment/keyframe target in elapsed recording time.
# Actual boundaries depend on available frames; this is not a hard loss bound.
fragment_target_s = 1
# Encoding options/filters: contracts/acquisition/encoding-options.md.
# Raw constant-rate stdin input is injected by acquisition (A08); encoder input
# format/throughput feasibility remains deferred to rig verification.
# Effective settings must be validated and locked for a session.

[recording.health]
stall_timeout_s = 10

[recording.diagnostics]
max_lines = 100
max_bytes = 65536

[recording.storage]
# Configurable video storage sync; separate from frame-log sync and fragment cadence.
# Also sync after finalization at graceful closure. Do not restart encoding to sync.
# Covers written bytes, not frames still inside the encoder; no maximum-loss guarantee.
video_sync_interval_s = 1

[preview]
# Configurable preview image bits per channel; validate converter/viewer support.
# Does not alter camera format, recording/tracking depth or guarantee monitor precision.
output_bit_depth = 8
# A03/A10: maximum session preview rate (in-trial frames only); 0 disables it.
# Never affects capture, pulses, recording, tracking or Ready.
session_preview_max_hz = 10

# Explicit saved choices take precedence over these defaults. All cameras may be
# disabled when no enabled consumer needs their input. Closed-loop tracking still
# requires a valid input source. A file's presence does not enable a camera.
# Camera serials and requested pulse rates are assigned above. Resolution, bit depth,
# physical camera trigger source and exposure choices remain unset.
# Common lifecycle/health policies come from experiment_config.toml and supervisor_config.toml.
