# Supervisor-owned defaults. See architecture.md: E04, E06, E08, E14.
# Shared settings have one owner. Every participating process reads health settings
# at startup; changing health/shutdown settings requires an application restart.
# Other owning configuration values follow E14 Setup/startup scope.
# GUI/headless session values and trial protocols cannot override them.
format_version = 1
# E14: fixed policy lives in contracts/policy/supervisor_policy.toml; versions must match.
policy_version = 7

[rpc]
# E08: fixed supervisor service port; bind only to loopback interfaces.
# Clients use this definition. Report conflicts instead of selecting another port.
port = 50052

[health]
# E08: controller <-> supervisor and coordinator -> supervisor heartbeats.
# Workers report to their coordinator at the same interval. Silence past the
# timeout is loss; there is no separate reconnect/recovery window. Process exit
# observed through an OS handle acts immediately. Also the launch registration deadline.
heartbeat_interval_s = 5
silence_timeout_s = 15
# Explicit required failures act immediately. GUI loss retains its nonfatal policy.

[emergency_report]
# Independent best-effort submission/queue/write completion budget.
# The surviving controller uses this same policy after established supervisor loss.
completion_timeout_s = 5
# Reports belong under CephVR2.0/reports/ (E04). Reporting never delays interruption.

[shutdown]
# Applies to explicit shutdown and automatic controller/supervisor-loss shutdown.
# These begin only after bounded session/output finalization. Request Shutdown and
# wait for normal process exit, then send OS termination and wait before force-kill.
graceful_process_exit_s = 5
terminate_process_exit_s = 2
# Launcher's final containment deadline, read once at startup (windows-launch.md).
# Setup is blocked if it is below the derived sum: silence_timeout_s + the larger
# Cancel Setup / Finished initial + shared recovery + 3 x (graceful + terminate).
# Defaults: 15 + (30 + 10) + 3 x 7 = 76 s.
application_shutdown_backstop_s = 90

# Warning/recovery and shutdown rules are defined in E03/E06/E08.
# Process-launch wire/native integration remains in contracts/README.md.
