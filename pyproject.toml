[build-system]
requires = ["setuptools>=77.0.3", "grpcio-tools==1.84.0"]
build-backend = "build_backend"
backend-path = ["tools"]

[project]
name = "cephvr"
version = "2.0.0.dev0"
description = "CephVR2.0 experiment control and backend application."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "grpcio>=1.84.0,<1.85",
    "protobuf>=7.36.2,<8",
    "tzdata>=2026.4",
    "tzlocal>=5.4.4,<6",
    "pydantic>=2.10,<3",
]

[project.optional-dependencies]
gui = [
    "PyQt6==6.11.0",
]
tracking = [
    "numpy==2.4.4",
    "opencv-python==4.13.0.92",
    "pypylon==26.3.1",
    "onnx>=1.20,<2",
    "onnxruntime-gpu>=1.23,<2; sys_platform == 'win32'",
]

visual_stimulus = [
    "PyOpenGL>=3.1.7,<4",
    "moderngl==5.12.0",
    "glfw==2.10.0",
    "glcontext==3.0.0",
    "numpy==2.4.4",
    "av==16.1.0",
    "imagecodecs==2025.3.30",
    "tifffile==2025.5.10",
]
acquisition = [
    "opencv-python==4.13.0.92",
    "pypylon==26.3.1",
    "numpy==2.4.4",
    "pyserial==3.5",
]
dev = [
    "swig==4.3.0; sys_platform == 'win32'",
    "build==1.6.1",
    "grpcio-tools==1.84.0",
    "mypy==2.3.1",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "ruff==0.16.9",
    "setuptools>=77.0.3",
    "types-protobuf==7.35.1.20260906",
]

[project.scripts]
cephvr = "cephvr.launcher.main:main"
cephvr-supervisor = "cephvr.supervisor.main:main"
cephvr-controller = "cephvr.controller.main:main"
cephvr-acquisition = "cephvr.acquisition.main:main"
cephvr-acquisition-worker = "cephvr.acquisition.worker.main:main"
cephvr-visual-stimulus = "cephvr.visual_stimulus.main:main"
cephvr-visual-stimulus-worker = "cephvr.visual_stimulus.worker.main:main"
cephvr-tracking = "cephvr.tracking.main:main"
cephvr-control = "cephvr.client.main:main"
cephvr-dashboard = "cephvr.gui.review:main"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = false

[tool.setuptools.packages.find]
where = ["src"]
include = ["cephvr", "cephvr.*"]
namespaces = false

[tool.setuptools.package-data]
"*" = ["*.pyi"]
"cephvr.tracking.native" = ["*.dll"]
"cephvr.platform.windows" = ["*.dll"]
"cephvr.acquisition.camera" = ["*.pyd"]

[tool.ruff]
target-version = "py311"
line-length = 88
indent-width = 4
src = ["src"]
force-exclude = true
extend-exclude = [
    "contracts",
    "reports",
    "*_pb2.py",
    "*_pb2.pyi",
    "*_pb2_grpc.py",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.mypy]
python_version = "3.11"
files = ["src/cephvr"]
strict = true
exclude = [
    '(^|/)[^/]*_pb2(_grpc)?\.pyi?$',
    '(^|/)pylon_wait_binding\.py$',
]

[[tool.mypy.overrides]]
module = ["grpc", "grpc.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["onnx", "onnx.*", "onnxruntime", "onnxruntime.*", "cv2", "glfw", "moderngl", "numpy", "numpy.*", "OpenGL", "OpenGL.*", "av", "av.*", "tifffile", "tifffile.*", "imagecodecs", "imagecodecs.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = ["--import-mode=importlib", "--strict-config", "--strict-markers"]
markers = [
    "windows: requires the Windows process or native-resource implementation",
    "rig: requires the real rig and its explicitly prepared devices and settings",
]
