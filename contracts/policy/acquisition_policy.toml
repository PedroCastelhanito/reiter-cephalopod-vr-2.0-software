# Fixed architecture policy for acquisition (E14/GOV-001). Not an operator file.
# Source rules: Camera/acquisition defaults. See architecture.md: E10, E14, A01-A05, A07-A11.
# Change only with the governing architecture decision, then bump policy_version
# here and in config/backends/acquisition_config.toml. The loader rejects a version mismatch.
policy_version = 20

[platform]
target_os = "windows"

[workers]
start_method = "fresh_interpreter_native_launcher"
lifetime = "session"
health_reporting = "heartbeat_to_coordinator_errors_to_supervisor"
process_layout = "one_worker_per_camera_capture_and_recording_threads"
control_transport = "grpc_loopback"
control_service = "cephvr.acquisition.v1.AcquisitionWorkerService"
setup_payload = "complete_resolved_settings_and_resources"
camera_setup_execution = "concurrent"
trial_preparation_payload = "trial_plan_and_configuration_revision"
port_assignment = "os_assigned"
control_execution = "separate_threads"
capture_wait = "frame_command_or_deadline"

[cameras]
roles = ["behavioral", "tracking", "eye_tracking"]
transport_tuning = "explicit_per_camera"
transport_settings_source = "config_file"
transport_parameter_names = "sdk_native"
transport_interfaces = ["usb3", "gige"]
pretrial_validation = "capture_critical_readback"
pixel_format_support = "broad_mono_color_bayer_packed"
image_format_implementation = "shared_python_module"
pixel_processing_location = "consumer_after_private_copy"
native_conversion_provider = "basler_sdk"
prepared_high_depth_alignment = "msb"
settings_representation = "typed_explicit_units"
capability_source = "connected_camera_sdk"
missing_feature_values = "read_camera"
settings_apply_failure = "stop_report_no_hardware_rollback"
frame_id_origin = "zero_based_per_trial"
sdk_access = "adapter_module"
sdk_delivery = "ordered"
grab_loop = "worker_owned_bounded_retrieve"
setting_readback_mismatch = "warn_accept_actual"
assignment = "explicit_device_id"
role_device_policy = "distinct_enabled_devices"
unknown_trigger_rate_limit = "warn_allow_setup"
acquisition_mode = "trial_only"
external_trigger_preparation = "armed_pulses_off"
stale_buffer_cleanup = "counted_purge_keep_connection"
post_cutoff_retrieval = "terminal_off_then_bounded_drain"
exposure_mode = "manual"
gain_mode = "manual"


[basler]
preset_format = "pfs"
preset_required = false
advanced_settings = "sdk_pfs_snapshot"
session_preset_storage = "external_filename_only"
preset_import_compatibility = "sdk_validation_and_readback"
preset_device_access = "connected_sdk_camera"
preset_connection_open = "automatic_assigned_camera"
preset_connection_lifetime = "editing_workflow_then_release"
preset_editing_completion = "explicit_client_command"
preset_setup_transition = "finish_release_then_prepare"
preset_export_pending_edits = "validate_apply_readback_then_export"
preset_control_loss = "bounded_release_on_control_loss"
unsaved_preset_changes = "warn_allow_run"

[frames]
native_metadata_setup = "enable_supported_if_needed"
invalid_image_action = "discard_report_continue"
hardware_counter_gap_action = "warn_continue"
hardware_counter_discontinuity_action = "warn_rebaseline_continue"
payload_format = "camera_native"
payload_layout = "sdk_native"
id_scope = "camera_trial"
non_trial_id_scope = "camera_acquisition_run"

[timing]
host_timestamp_point = "camera_worker_receipt"
host_timestamp_regression_action = "report_and_interrupt"
trial_membership = "host_receipt_start_inclusive_stop_exclusive"

[buffers]
allocation_api = "multiprocessing.shared_memory"
shared_rings = ["tracking", "preview_latest_frame"]
recording_transfer = "in_process_bounded_queue"
setup_allocation = "after_confirmed_camera_readback"
naming = "unique_per_allocation"
layout_metadata = "per_prepared_buffer"
lifetime = "session"
owner = "acquisition_coordinator"
synchronization = "seqlock_slot_generation"
writer_wait = "never"
wakeup_primitive = "win32_auto_reset_event"
lapped_read_action = "skip_counted"
crashed_participant_action = "retire_allocation"
read_mode = "copy_then_recheck_generation"
working_buffer_allocation = "prepare_and_reuse"

[recording]
output_tag = "camera_role_cam"
frame_log_video_column = "video_frame"
metadata_policy = "with_video"
frame_records_format = "jsonl_header_source_frames_encoded_mappings_completion"
saved_confirmation = "online_accounting_and_durable_closure"
empty_video_action = "warn_continue_keep_metadata"
empty_video_result = "explicit_content_presence_and_closure"
buffer_full_action = "drop_frames_and_continue"
drop_selection = "oldest_waiting"

[recording.frame_log]
schema = "contracts/acquisition/frame_log_schema.toml"
frames_file = "append_only_jsonl_header_source_frame_encoded_mapping_completion"
diagnostics = "grouped_by_code_in_completion_plus_per_frame_invalid_code"
diagnostic_details_overflow = "truncate_with_marker"
pair_identity = "embedded_existing_identities"
native_missing_values = "empty_field_or_null"
native_timestamp_unit = "ns"
native_clock_provenance = "prepared_descriptor"
native_timestamp_unavailable = "warn_and_leave_empty"
invalid_image_row = "dropped"
video_correspondence = "nominal_slot_to_real_source_or_identified_duplicate"
row_write_policy = "source_after_selection_encoded_mapping_after_input_submission"
pending_records_owner = "camera_worker_recording_thread"
metadata_transport = "in_process_with_frame"
capture_completion = "single_end_marker_after_drain_with_independent_stop_and_pulse_evidence"
append_schedule = "sync_cycle_and_closure"
crash_state = "valid_to_last_complete_row"
recovery = "none_external_post_hoc"

[recording.tools]
discovery = "system_path"
version_policy = "documented_tested_ffmpeg"
version_mismatch = "warn_and_log_no_prompt"

[recording.encoding]
started_evidence = "real_trial_input_processing"
lifetime = "trial"
preparation = "recording_thread_before_ready_encoder_launch_at_schedule_no_frames_before_t"
pre_start_cancel = "terminate_encoder_delete_only_its_created_output"
pixel_conversion = "shared_native_preparation_then_explicit_ffmpeg_args"
input_representation = "rgb_color_bayer_grayscale_mono"
bit_depth_policy = "preserve_unless_explicit_recording_depth"
supported_recording_bit_depths = [8, 10]
recording_depth_mapping = "full_range_nearest_v1"
output_pixel_format_policy = "explicit_per_camera_args"
bayer_output = "rgb_source_depth"
framework = "ffmpeg"
acceleration = "nvenc"
input_connection = "stdin_pipe"
input_packaging = "raw_frames"
input_writer = "dedicated_thread"
input_frame_source = "in_process_recording_queue"
input_flush = "each_frame"
input_compression = "none"
args_scope = "output_only"
args_ownership = "per_camera"
container = "mp4"
mp4_mode = "hybrid_fragmented"
faststart = false
playback_timing = "constant_nominal_rate"
nominal_rate_source = "applied_mcu_rate_or_free_running_frame_rate"
# A07/A08: first usable receipt per slot; identified first-image leading backfill,
# then previous-image interior/trailing padding through the actual cutoff.
frame_duplication = true
b_frames = 0
final_frame_duration = "one_nominal_period"

[recording.health]
progress_monitor = "ffmpeg_progress"
stall_action = "fence_recording_path_and_classify_e06_incident"

[recording.diagnostics]
retention = "bounded_memory"
failure_output = "incident_report"

[recording.validation]
argument_policy = "explicit_supported_set"
argument_conflict_policy = "reject"
duplicate_scalar_options = "reject"
filter_policy = "explicit_supported_set"
filter_graph_policy = "linear_single_stream"
transform_parameters = "session_static"
supported_filters = ["format", "scale", "crop", "pad", "hflip", "vflip"]
encoder_probe = "capabilities_only"
closure = "encoder_finalize_sync_close"

[diagnostics]
transport_summary = "per_trial_if_available"
transport_summary_status = "latest_completed_trial"
warning_grouping = "camera_context_code_count_first_last"
diagnostic_codes = "cephvr_stable_with_sdk_details"

[preview]
allow_session_disabled_camera = true
failure_scope = "affected_previews"
stop_action = "close_camera_release_buffers"
control_loss_action = "stop_and_release_on_control_loss"
setting_change = "stop_apply_restart"
capacity_frames = 1
buffer_lifetime = "manual_preview_run_or_session"
session_preview = "latest_frame_rate_capped_in_trial_only"
viewer_attachment = "acquisition_owned_opencv_independent_of_capture"
window_presentation = "square_letterbox_pointer_wheel_zoom_gui_initial_placement"
busy_action = "skip_update"
timing = "camera_configuration"
drive_external_pulses = true
pulse_frequency = "same_as_capture"
frame_selection = "latest"
color_conversion = "rgb_color_bayer_grayscale_mono"
conversion_implementation = "basler_sdk_via_common_module"
brightness_scaling = "fixed_full_format_range"
manual_outside_session = true
session_preview_gates_nothing = true
stop_before_setup = true
