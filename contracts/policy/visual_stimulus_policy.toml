# Fixed architecture policy for visual_stimulus (E14/GOV-001). Not an operator file.
# Source rules: Visual Stimulus defaults. See architecture.md: V01–V28, E10, E13, E14, A06.
# Change only with the governing architecture decision, then bump policy_version
# here and in config/backends/visual_stimulus_config.toml. The loader rejects a version mismatch.
policy_version = 8

[runtime]
process_layout = "coordinator_and_render_worker_with_recording_thread_when_saving"
rendering_library = "moderngl"
window_library = "glfw"

[projection]
method = "generalized_off_axis_perspective"
surfaces = ["front", "left", "right", "bottom"]
observer_position_policy = "fixed_at_setup"
geometric_correction = "imported_static_mesh"
optional_correction_inputs = ["static_mask", "static_overlap_weights"]

[programs]
authoring_model = "scenes_epochs_groups"
scene_composition = "optional_single_arena_then_ordered_2d_layers"
storage_format = "versioned_json"
model_library = "pydantic_v2"
schema_source = "generated_from_program_model"
validation_policy = "shared_strict_structural_and_semantic"
execution_input = "immutable_prepared_plan"
trial_plan_retention = "always_stimulus_log_complete_prepared_trial"
coordinate_spaces = ["physical_surface", "visual_angle"]
parameter_animation = "builtin_functions_and_keyframes"
animation_clock = "epoch_relative"
duration_modes = ["explicit_epochs", "target_total_random_epochs"]
trial_duration_source = "resolved_epoch_sum"
random_duration_distribution = "uniform_feasible_combinations"
random_duration_repeats = "sample_each_occurrence"
epoch_state = "preserve_compatible_by_default"
absent_instance_state = "pause_and_retain"
trial_state = "initialize_from_declared_start"
group_order_modes = ["as_listed", "shuffle_each_repetition"]
group_order_default = "as_listed"

[assets]
source_stability = "prepared_memory_or_protected_read_handles"
protection_failure = "fail_preparation"
image_profiles = ["png_uint_v1", "tiff_uint_v1", "jpeg8_v1"]
video_profiles = ["mp4_h264_sdr8_v1", "matroska_ffv1_v3_uint_v1"]
arena_profile = "glb2_static_unlit_v1"

[arena]
source_policy = "externally_prepared_assets"
boundary_source = "trial_protocol"
movement_modes = ["simple_boundaries", "unrestricted"]
boundary_response = "slide"
shading = "unlit"

[idle]
content = "uniform_background"
startup = "validate_saved_display_settings_then_present_idle"
invalid_startup_configuration = "leave_outputs_uninitialized_and_report"

[video]
preparation = "bounded_decode_ahead"
decoder_library = "pyav_ffmpeg"
decoder_execution = "bounded_threads_in_render_worker"
decoder_context_ownership = "one_serial_owner"
codec_thread_policy = "explicit_per_context_and_aggregate_limits"
end_behaviors = ["hold_final_frame", "loop"]
end_behavior_default = "hold_final_frame"
late_frame_policy = "skip_overdue_preserve_clock"
unavailable_frame_policy = "hold_last_valid_and_log"

[timing]
missed_presentation_policy = "record_and_continue_schedule"

[presentation]
supported_modes = ["all_outputs_vsync", "photodiode_only_vsync"]
default_mode = "photodiode_only_vsync"
supported_rgb_bits_per_channel = [8, 10]
precision_policy = "explicit_per_output_require_framebuffer_match"
quantization = "nearest_integer_half_up"

[photodiode]
pattern_family = "frame_alternation_with_periodic_landmarks"
pattern_version = 1
marker_levels = ["high", "high", "high", "low", "low", "low"]
period_frames = 60
reset_at = "trial_start"

[color]
working_space = "linear_rec709_d65_relative"
composition_format = "rgba32f"
alpha = "premultiplied_linear"
output_correction = "once_after_composition"
uncalibrated_encoding = "srgb"

[photometric_calibration]
supported_modes = ["calibrated", "uncalibrated"]
model = "per_channel_measured_inverse_lut_v1"
interpolation = "piecewise_linear_uniform_input_grid"

[output_range]
policy = "clip_and_log"

[recording]
plan_log_suffix = "_stimulus_LOG.json"
evidence_suffix = "_stimulus_frames.jsonl"
video_suffix = "_stimulus.mp4"
plan_log_owner = "coordinator_bounded_background_writer"
video_source = "final_output_images_after_renderer_corrections"
video_layout = "one_tiled_composite_per_trial"
tile_order = "display_output_order_row_major"
tile_grid_columns = "ceil_sqrt_output_count"
tile_scale = "smallest_integer_divisor_fitting_encoder_maximum"
tile_resampling = "bilinear"
composite_depth = "largest_output_depth_widened_codes"
encoder_sessions = 1
recording_execution = "renderer_recording_thread_and_ffmpeg_subprocess"
readback = "gl_thread_pbo_to_bounded_capture_slots_recording_thread_writes_raw_frames"
encoder_launch = "at_schedule_trial_off_render_thread_no_frames_before_t"
video_fidelity = "high_quality_lossy"
framework = "ffmpeg"
args_scope = "output_only"
args_ownership = "composite"
argument_contract = "shared_acquisition_inventory_with_visual_stimulus_constraints"
container = "mp4"
review_timing = "constant_nominal_refresh_rate_of_pacing_output"
review_frame_mapping = "first_usable_evaluation_per_nominal_slot_with_identified_duplicates"
# E13/V12/V28: leading backfill uses the first real image; later gaps repeat
# the preceding selected image with exact source-group/time evidence.
frame_duplication = true
mp4_mode = "fragmented"
review_depth_policy = "explicit_conversion_allow_reduction"
empty_video_policy = "allow_confirmed_never_created_or_closed_empty"
overload_policy = "drop_incoming_video_preserve_metadata"
evidence_format = "json_lines"
record_durability = "append_only_periodic_os_sync"
evidence_layout = "one_line_per_render_group_plus_late_update_lines"
crash_state = "valid_to_last_complete_line"
crash_recovery = "none_replay_labels_partial"
crashed_review_video = "unconfirmed_no_repair"

[replay]
source = "trial_program_and_actual_render_evidence"
export_fidelity = "lossless"
asset_retention = "external_originals_with_content_fingerprints"
fingerprint = "sha256"
fingerprint_cache = "local_keyed_by_path_size_mtime"
partial_replay = "complete_lines_labelled_partial"
verification = "inputs_and_state_only"

[feedback]
mapping = "explicit_per_channel"
operations = ["direct_value", "movement_integration", "heading_relative_planar_integration"]
invalid_input_policy = "hold_feedback_state_and_log"
epoch_attribution = "current_at_application"
motion_composition = "add_to_retained_state"
stale_result_policy = "reject_locally_hold_until_fresh"
age_reference = "source_host_receipt_to_application"

[tracking_results]
consumption = "all_pending_at_render_start"
