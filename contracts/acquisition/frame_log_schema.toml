# A07/E04 format declaration, NOT runtime configuration or a writer.
# A07/A08 sequential image mapping; original source timing remains authoritative.
# One append-only JSON Lines frame log per recorded camera/trial, next to that
# camera's MP4: a header, received-image rows, encoded-image mappings and completion.
contract_status = "declared" # Host acceptance/verification: reports/acquisition.md.
schema_version = 5 # v4 used host-time slots and identified padding; never reinterpret old logs.
camera_roles = ["behavioral", "tracking", "eye_tracking"]
camera_tags = ["behavioral_cam", "tracking_cam", "eye_tracking_cam"]
video_pattern = "<trial_prefix>_<camera_role>_cam.mp4"
frames_pattern = "<trial_prefix>_<camera_role>_cam_frames.jsonl"

[format]
# UTF-8 JSON Lines, LF-terminated, compact separators, fixed key order per line type,
# every line carries "type". Integers are JSON integers (ns values stay exact int64;
# readers should load ns fields as int64, not float). null = unavailable, never 0.
line_types = ["header", "frame", "video_frame", "completion"]
order = "header_then_ordered_source_rows_and_encoded_mapping_rows_then_completion"
sync = "append_ready_lines_then_os_sync_every_sync_interval_s_and_at_close"
crash_state = "valid_up_to_last_complete_line_missing_completion_means_incomplete"
# A reader discards an incomplete final line. No checkpoints, checksums, index or
# rewrite: the file is append-only from creation (at/after T) to closure.

[header]
# Written at trial-file creation (at/after T), before any frame line.
fields = ["type", "schema_version", "identity", "clocks", "video"]

[header.identity]
fields = ["session_id", "trial_id", "trial_number", "camera_role", "device_id", "session_config_reference", "recording_identity_version"]
recording_identity_version = 1 # recording-identity.md binds the same IDs into MP4 tags.

[header.clocks]
host_clock = "cephvr.host.perf_counter_ns.v1" # From contracts/host-clock.md.
timestamp_unit = "ns"
trial_start_monotonic_ns = "required"
# Camera clock/counter descriptor fields are bound by camera-clock.md:
camera_clock_fields = [
  "camera_clock", "camera_clock_source", "camera_clock_conversion_available",
  "camera_clock_tick_ns_numerator", "camera_clock_tick_ns_denominator",
  "camera_clock_timestamp_semantics", "camera_clock_reset_semantics",
  "camera_clock_wrap_semantics", "camera_clock_unavailable_reason",
  "camera_counter_source", "camera_counter_semantics", "camera_counter_width_bits",
  "camera_counter_wrap_semantics", "camera_counter_unavailable_reason",
]
camera_clock_value = "cephvr.camera.native.v1"

[header.video]
# Sequential images (A08): frame n plays at n / nominal_frame_rate_hz.
# Playback duration need not equal trial duration; real timing comes from source rows.
fields = ["enabled", "nominal_frame_rate_hz", "nominal_rate_source"]
# enabled=false: no video_frame lines, all source rows have video_disposition=video_disabled,
# video_frame=null and dropped=false. invalid_code still identifies invalid images.
# Video counts are zero and first_recorded_frame_id is null; metadata counts remain actual.
nominal_rate_source_values = ["applied_mcu_rate", "free_running_frame_rate"]

[frame]
# One line per received in-trial image, including invalid images and recording drops,
# appended once its drop decision is final, in contiguous source order; never placeholders.
fields = ["type", "frame_id", "host_receipt_ns", "dropped", "video_frame", "video_disposition", "camera_frame_counter", "camera_timestamp_ns", "invalid_code"]
frame_id_start = 0 # Per camera per trial, including invalid/dropped frames (A09).
# dropped: true/false. video_frame: contiguous encoded index for retained usable images;
# null for invalid/capacity-dropped sources. video_disposition identifies why an image
# was not recorded. camera_* : null when unavailable.
# invalid_code: null for valid images; stable code for invalid/incomplete images.
video_disposition_values = ["real", "invalid_image", "capacity_drop", "video_disabled"]
video_mapping = "explicit_encoded_video_frame_lines_reference_original_source_identity_and_time"

[video_frame]
fields = ["type", "encoded_frame_index", "source_frame_id", "source_host_receipt_ns", "disposition"]
disposition_values = ["real"]
selection = "every_usable_retained_source_once_in_source_order"
endpoint = "no_padding_at_actual_cutoff"

[completion]
# Appended once at closure after drain/reconciliation; absent after a crash.
fields = ["type", "outcome", "timing", "video", "pulses", "post_cutoff", "transport_summary", "diagnostics"]
outcome_values = ["completed", "interrupted"] # Same values as SESSION_LOG trial outcomes.

[completion.timing]
fields = [
  "recording_end_monotonic_ns",     # Producer E11 cutoff; null without matched proof.
  "first_recorded_frame_id",        # null if no frame was recorded.
  "final_received_frame_count",     # From the matching end marker; 0 is valid.
  "accounting_complete",            # true only after every frame line 0..N-1 was written.
]

[completion.video]
fields = ["recorded_frame_count", "selected_source_frame_count", "duplicate_frame_count"]
recorded_frame_count = "complete sequential images submitted to FFmpeg input; not proof of encoded/persisted samples"
# Successful correspondence requires recorded == selected; duplicate_frame_count is always 0.

[completion.pulses]
# SYS-004 matching evidence from A11 grouped ON/OFF; null for free-running cameras
# or missing evidence at the finalization deadline. Host dispatch/ACK, not edges.
fields = [
  "on_outcome", "on_dispatched_monotonic_ns", "on_acknowledged_monotonic_ns",
  "off_outcome", "off_dispatched_monotonic_ns", "off_acknowledged_monotonic_ns",
]
outcome_values = "PulseCommandOutcome enum names; null = unavailable, never success"

[completion.post_cutoff]
# Frames received at/after the camera cutoff through terminal retrieval/purge,
# excluded from frame lines under A09. See recording-lifecycle.md.
fields = ["accounting_complete", "excluded_frame_count", "last_native_counter"]

[completion.transport_summary]
# One compact SDK transport-counter summary per camera/trial; null = unknown.
fields = ["buffer_underruns", "failed_buffers", "missed_frames", "resend_requests", "resend_packets", "resynchronizations"]

[completion.diagnostics]
# Grouped by code: one entry per code with count and first/last observation.
# Per-frame invalid-image causes are also on each frame line (invalid_code).
entry_fields = ["code", "count", "first_observed_monotonic_ns", "last_observed_monotonic_ns", "first_frame_id", "details"]
code_max_bytes = 64          # Must fit unchanged.
details_max_bytes = 1024     # Truncate at a UTF-8 boundary, including the marker.
truncation_marker = " [truncated]"
