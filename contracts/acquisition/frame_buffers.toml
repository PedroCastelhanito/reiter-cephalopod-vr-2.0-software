# A03/A04 internal shared-memory layout declaration, not a new user configuration file.
# Seqlock slots; no lock. No implementation or rig verification. Shared rings only:
# tracking and preview latest-frame. Recording uses an in-process queue (no layout).
layout_version = 2
byte_order = "little"
alignment_bytes = 64
header_bytes = 128
slot_metadata_bytes = 64
# Header, capacity * slot metadata, then capacity * aligned image payload slots.
# pixel_base = align_up(header_bytes + capacity * slot_metadata_bytes, 64)
# pixel_stride = align_up(image_payload_bytes, 64)
# allocation_bytes = pixel_base + capacity * pixel_stride
# Check positive dimensions/capacity and all multiplication/addition bounds.

[header]
fields = [
  { name = "magic", format = "8s", offset = 0 },
  { name = "layout_version", format = "I", offset = 8 },
  { name = "kind", format = "I", offset = 12 },
  { name = "capacity_frames", format = "I", offset = 16 },
  { name = "flags", format = "I", offset = 20 },
  { name = "run_id", format = "16s", offset = 24 },
  { name = "allocation_id", format = "16s", offset = 40 },
  { name = "discontinuity_epoch", format = "Q", offset = 56 },
  { name = "published_count", format = "Q", offset = 64 },
  { name = "reserved", format = "56s", offset = 72 },
]
magic = "CEPHFRM2"
# UUID fields use uuid.UUID.bytes (RFC byte order), not Windows GUID bytes_le.
# run_id = trial UUID, or preview acquisition-run UUID; all-zero = not yet bound.
# Only the producer writes flags/epoch/published_count while running; the owner resets
# run fields only while the producer is quiescent. published_count = frames published
# in this run, written after the slot; newest slot = (published_count - 1) % capacity.

[header_flags]
input_sealed = 1
retired = 2
# Unknown bits reject. New allocations start sealed; only authorized start opens.

[kinds]
# Value 1 (recording) is retired: A03 recording uses an in-process queue.
tracking = 2
preview = 3

[slot]
fields = [
  { name = "generation", format = "Q", offset = 0 },
  { name = "flags", format = "I", offset = 8 },
  { name = "reserved0", format = "4s", offset = 12 },
  { name = "frame_id", format = "Q", offset = 16 },
  { name = "acquisition_time_ns", format = "q", offset = 24 },
  { name = "camera_frame_counter", format = "Q", offset = 32 },
  { name = "camera_timestamp_ns", format = "q", offset = 40 },
  { name = "discontinuity_epoch", format = "Q", offset = 48 },
  { name = "sequence", format = "Q", offset = 56 },
]
# Seqlock: the writer makes generation odd, writes metadata and pixels, then makes it
# even. A reader notes an even generation, copies metadata and pixels, then rechecks:
# changed or odd = torn/lapped read; discard the copy and count a skip.
# sequence = 0-based publish order in this run; slot index = sequence % capacity.
# 64-bit counters never wrap within a session. Invalid images never enter slots.
# Native availability bits != saved status; consumers select by sequence.

[slot_flags]
camera_frame_counter_valid = 1
camera_timestamp_valid = 2
# Missing native numeric values are zero-filled and ignored; required receipt is real.
# Reserved/padding bytes start zero; never interpret them as fields or image data.
