syntax = "proto3";

package cephvr.control.v1;

import "cephvr/control/v1/types.proto";
import "cephvr/acquisition/v1/messages.proto";
import "cephvr/acquisition/v1/camera.proto";
import "cephvr/acquisition/v1/microcontroller.proto";
import "cephvr/acquisition/v1/runtime.proto";
import "cephvr/visual_stimulus/v1/runtime.proto";
import "cephvr/tracking/v1/methods.proto";
import "cephvr/tracking/v1/preparation.proto";
import "cephvr/synchronization/v1/spikeglx.proto";

// E08: loopback control only. The sole streaming RPC is WatchState.
// Authentication credentials belong in protected gRPC metadata, never
// these payloads. Server admission must enforce role, generation and lease rules.
service ExperimentControllerService {
  rpc ReportDataPreparation(DataPreparationReport) returns (ReportReceipt);
  rpc ReportVisualStimulusDisplay(VisualStimulusDisplayView) returns (ReportReceipt);
  rpc OpenDisplayCalibration(OpenDisplayCalibrationRequest) returns (CommandAdmission);
  rpc CloseDisplayCalibration(CloseDisplayCalibrationRequest) returns (CommandAdmission);
  rpc GetSnapshot(SnapshotRequest) returns (Snapshot);
  rpc WatchState(WatchRequest) returns (stream Snapshot);
  rpc UpdateConfiguration(UpdateConfigurationRequest) returns (CommandAdmission);
  rpc GetSpikeGLXInventory(SpikeGLXInventoryRequest) returns (SpikeGLXInventorySnapshot);
  rpc UpdateSpikeGLXInventory(SpikeGLXInventoryUpdateRequest) returns (CommandAdmission);
  rpc BeginTrackingDiagnostic(BeginTrackingDiagnosticRequest) returns (CommandAdmission);
  rpc CloseTrackingDiagnostic(CloseTrackingDiagnosticRequest) returns (CommandAdmission);
  rpc GetTrackingDiagnosticState(TrackingDiagnosticQuery) returns (TrackingDiagnosticState);
  rpc ExecuteCameraCommand(CameraCommandRequest) returns (CommandAdmission);
  rpc ExecuteMicrocontrollerCommand(MicrocontrollerCommandRequest) returns (CommandAdmission);
  rpc CheckSpikeGLXConnection(SpikeGLXConnectionQuery) returns (SpikeGLXConnectionResult);
  rpc GetPreviewAttachment(PreviewAttachmentQuery) returns (PreviewAttachmentResult);
  rpc ReportPreviewAttachment(PreviewAttachmentReport) returns (ReportReceipt);
  rpc ReportPreviewConsumerState(PreviewConsumerReport) returns (ReportReceipt);
  rpc ReportAcquisitionResolution(AcquisitionResolutionReport) returns (ReportReceipt);
  rpc ReportAcquisitionDeviceStatus(AcquisitionDeviceStatusReport) returns (ReportReceipt);
  rpc ReportAcquisitionWarnings(AcquisitionWarningReport) returns (ReportReceipt);
  rpc SaveConfigurationHistory(OperatorCommand) returns (CommandAdmission);
  rpc AcquireControl(ControlClaim) returns (CommandAdmission);
  rpc ReleaseControl(OperatorCommand) returns (CommandAdmission);
  rpc TakeOverControl(ControlClaim) returns (CommandAdmission);
  rpc Setup(OperatorCommand) returns (CommandAdmission);
  rpc CancelSetup(OperatorCommand) returns (CommandAdmission);
  rpc NewSession(OperatorCommand) returns (CommandAdmission);
  rpc StartSession(OperatorCommand) returns (CommandAdmission);
  rpc StopAfterTrial(OperatorCommand) returns (CommandAdmission);
  rpc CancelStopAfterTrial(OperatorCommand) returns (CommandAdmission);
  rpc AbortNow(OperatorCommand) returns (CommandAdmission);
  rpc ShutdownApplication(OperatorCommand) returns (CommandAdmission);
  rpc RespondToPrompt(PromptResponse) returns (CommandAdmission);
  rpc ReportLifecycle(LifecycleReport) returns (ReportReceipt);
  rpc ReportInterruption(InterruptionReport) returns (ReportReceipt);
  // Supervisor -> controller; controller detects a hung supervisor by silence (E08).
  rpc ReportHeartbeat(HeartbeatReport) returns (ReportReceipt);
  rpc ReportSupervisorStatus(SupervisorStatusReport) returns (ReportReceipt);
}
service SupervisorService {
  // Independent preview release/failure evidence; ATTACHED is not accepted here.
  rpc ReportPreviewConsumerState(PreviewConsumerReport) returns (ReportReceipt);
  rpc PlanLaunch(PlanLaunchRequest) returns (LaunchReceipt);
  rpc ConfirmLaunch(ConfirmLaunchRequest) returns (LaunchReceipt);
  rpc GetLaunchState(LaunchQuery) returns (LaunchState);
  // Before Setup Ready, at Start and on session-level updates (incident scopes);
  // never per trial (E08).
  rpc RegisterContext(RegisterContextRequest) returns (RegistrationReceipt);
  // Controller and top-level coordinators only; workers report to their coordinator.
  rpc ReportHeartbeat(HeartbeatReport) returns (ReportReceipt);
  rpc ReportError(ErrorReport) returns (ReportReceipt);
  rpc GetRecoveryState(RecoveryQuery) returns (RecoverySnapshot);
  rpc ExecuteRecoveryAction(RecoveryActionRequest) returns (CommandAdmission);
  // E08/O2: top-level backend Cleanup only; Stopped/Finished go to controller alone.
  // Query internal worker retained state after coordinator loss: acquisition
  // GetState/GetRetainedResult; Visual Stimulus GetState. Output reservation is controller-local (E04).
  rpc ReportLifecycle(LifecycleReport) returns (ReportReceipt);
  rpc RequestApplicationShutdown(ApplicationShutdownRequest) returns (CommandAdmission);
}
// V19: controller-only initial display preparation, not an operator retry API.
service VisualStimulusConfigurationService {
  rpc InitializeDisplay(VisualStimulusDisplayInitializationRequest) returns (CommandAdmission);
  rpc OpenDisplayCalibration(VisualStimulusDisplayCalibrationOpenRequest) returns (CommandAdmission);
  rpc CloseDisplayCalibration(VisualStimulusDisplayCalibrationCloseRequest) returns (CommandAdmission);
}
message OpenDisplayCalibrationRequest {
  OperatorCommand command = 1;
  uint64 expected_configuration_revision = 2;
  string diagnostic_id = 3;
  string profile_asset_reference = 4; // Relative to the adopted asset root.
  string arena_asset_reference = 5; // Relative to the adopted asset root.
  string expected_profile_sha256 = 6;
  string expected_arena_sha256 = 7;
}
message CloseDisplayCalibrationRequest {
  OperatorCommand command = 1;
  uint64 expected_configuration_revision = 2;
  string diagnostic_id = 3;
}
message VisualStimulusDisplayCalibrationOpenRequest {
  string command_id = 1;
  ProcessIdentity issuer = 2;
  BackendContext target = 3;
  uint64 configuration_revision = 4;
  string diagnostic_id = 5;
  int64 deadline_monotonic_ns = 6;
  string profile_json = 7;
  string profile_sha256 = 8;
  optional string asset_root = 9;
  string arena_relative_path = 10;
  uint64 arena_size_bytes = 11;
  string arena_sha256 = 12;
  cephvr.visual_stimulus.v1.VisualStimulusFilePolicies policies = 13;
}
message VisualStimulusDisplayCalibrationCloseRequest {
  string command_id = 1;
  ProcessIdentity issuer = 2;
  BackendContext target = 3;
  uint64 configuration_revision = 4;
  string diagnostic_id = 5;
  int64 deadline_monotonic_ns = 6;
}
message VisualStimulusDisplayInitializationRequest {
  string command_id = 1;
  ProcessIdentity issuer = 2;
  BackendContext target = 3;
  uint64 configuration_revision = 4;
  cephvr.visual_stimulus.v1.DisplayConfiguration display = 5;
  cephvr.visual_stimulus.v1.ResourceLimits limits = 6;
  ControlPolicies policies = 7;
  int64 deadline_monotonic_ns = 8;
  optional string asset_root = 9; // Display-only protected dependencies before Setup.
  optional double pacing_refresh_hz = 10; // File-only V20 target, absent preserves profile fallback.
  optional string pacing_output_id = 11; // File-only V20 identity; never infer from a GUI selection.
}
service BackendService {
  rpc ApplyIncidentScope(IncidentScopeRequest) returns (CommandAdmission);
  // No controller heartbeat here: coordinators watch controller/supervisor OS
  // process handles and act on supervisor InterruptSession (E08).
  rpc SetupSession(SetupSessionRequest) returns (CommandAdmission);
  rpc CancelSetup(BackendCommand) returns (CommandAdmission);
  rpc PrepareTrial(PrepareTrialRequest) returns (CommandAdmission);
  rpc ScheduleTrial(ScheduleTrialRequest) returns (CommandAdmission);
  rpc ReleaseTrial(ReleaseTrialRequest) returns (CommandAdmission);
  rpc StopTrial(StopTrialRequest) returns (CommandAdmission);
  rpc AbortTrial(StopTrialRequest) returns (CommandAdmission);
  rpc InterruptSession(InterruptSessionRequest) returns (CommandAdmission);
  rpc GetState(BackendQuery) returns (ParticipantState);
  rpc GetRetainedResult(RetainedResultQuery) returns (RetainedResult);
  // E06 "Retry graceful cleanup": idempotent re-entry of the same cleanup path.
  rpc Cleanup(BackendCommand) returns (CommandAdmission);
  rpc Shutdown(BackendCommand) returns (CommandAdmission);
}

// Hosted on acquisition's existing endpoint; clients use the controller front door.
service AcquisitionConfigurationService {
  rpc ConfirmTrackingInput(TrackingInputConfirmation) returns (CommandAdmission);
  rpc ApplyCameraSettings(AcquisitionCameraSettingsCommand) returns (CommandAdmission);
  rpc ApplyPulseConfiguration(AcquisitionPulseCommand) returns (CommandAdmission);
  rpc ReportPreviewConsumerState(PreviewConsumerReport) returns (ReportReceipt);
  rpc ExecuteCameraCommand(AcquisitionCameraCommand) returns (CommandAdmission);
  rpc ExecuteMicrocontrollerCommand(AcquisitionMicrocontrollerCommand) returns (CommandAdmission);
  rpc ConfirmConfiguration(AcquisitionConfigurationConfirmation) returns (CommandAdmission);
  rpc AttachTrackingDiagnosticInput(AcquisitionTrackingDiagnosticAttachmentCommand) returns (CommandAdmission);
}
message SpikeGLXInventoryRequest {
  OperatorCommand command = 1;
  uint64 expected_configuration_revision = 2;
}
message SpikeGLXInventorySnapshot {
  uint64 configuration_revision = 1;
  string file_sha256 = 2;
  repeated cephvr.synchronization.v1.PulseChannel pulse_channels = 3;
  optional bool backend_enabled = 4;
  optional string address = 5;
  optional uint32 command_port = 6;
}
message SpikeGLXInventoryUpdateRequest {
  OperatorCommand command = 1;
  uint64 expected_configuration_revision = 2;
  string expected_file_sha256 = 3;
  repeated cephvr.synchronization.v1.PulseChannel pulse_channels = 4;
}
message BeginTrackingDiagnosticRequest {
  OperatorCommand command = 1;
  uint64 expected_configuration_revision = 2;
  string preview_run_id = 3;
  repeated TrackingDiagnosticStage selected_stages = 4;
  TrackingSettings diagnostic_settings = 5; // Frozen diagnostic-only draft; never updates experiment configuration.
}
message CloseTrackingDiagnosticRequest {
  OperatorCommand command = 1;
  uint64 expected_configuration_revision = 2;
  string diagnostic_id = 3;
  string preview_run_id = 4;
}
message TrackingDiagnosticQuery {
  string client_id = 1;
  string controller_generation = 2;
  uint64 configuration_revision = 3;
  string diagnostic_id = 4;
  string preview_run_id = 5;
  ProcessIdentity viewer = 6;
}
message AcquisitionTrackingDiagnosticAttachmentCommand {
  BackendCommand command = 1;
  uint64 configuration_revision = 2;
  string preview_run_id = 3;
  ProcessIdentity tracking_consumer = 4;
  // Duplicates only the exact ordered TRACKING ring into manual preview scope.
}
enum CameraCommandKind {
  CAMERA_COMMAND_KIND_UNSPECIFIED = 0;
  CAMERA_COMMAND_KIND_START_PREVIEW = 1;
  CAMERA_COMMAND_KIND_STOP_PREVIEW = 2;
  CAMERA_COMMAND_KIND_IMPORT_PFS = 3;
  CAMERA_COMMAND_KIND_EXPORT_PFS = 4;
  CAMERA_COMMAND_KIND_FINISH_EDITING = 5;
  CAMERA_COMMAND_KIND_ATTACH_PREVIEW_VIEWER = 6;
  CAMERA_COMMAND_KIND_TEST_CONNECTION = 7; // Open/identify/close only; no capture or pulses.
}
enum MicrocontrollerCommandKind {
  MICROCONTROLLER_COMMAND_KIND_UNSPECIFIED = 0;
  MICROCONTROLLER_COMMAND_KIND_CONNECT = 1;
  MICROCONTROLLER_COMMAND_KIND_START = 2;
  MICROCONTROLLER_COMMAND_KIND_STATUS = 3;
  MICROCONTROLLER_COMMAND_KIND_STOP = 4;
}
message MicrocontrollerCommandRequest {
  OperatorCommand command = 1;
  optional uint64 expected_configuration_revision = 2;
  MicrocontrollerCommandKind kind = 3;
  MicrocontrollerSignalKind signal = 4; // START only; pin/rate come from current configuration.
}
// E12/G01: authenticated, read-only controller diagnostic; no Setup or run mutation.
message SpikeGLXConnectionQuery {
  string client_id = 1;
}
message SpikeGLXConnectionResult {
  bool connected = 1;
  string address = 2;
  uint32 port = 3;
  string version = 4;
  bool running = 5;
  bool saving = 6;
  string run_name = 7;
  string data_directory = 8;
  string error = 9;
}
message AcquisitionMicrocontrollerCommand {
  BackendCommand command = 1;
  optional uint64 configuration_revision = 2;
  MicrocontrollerCommandKind kind = 3;
  MicrocontrollerSignalKind signal = 4;
  cephvr.acquisition.v1.CameraPulseConfiguration requested = 5;
  AcquisitionSettings settings = 6; // Complete controller-accepted Configuration draft.
}
message CameraCommandRequest {
  OperatorCommand command = 1;
  optional uint64 expected_configuration_revision = 2;
  cephvr.acquisition.v1.CameraRole camera = 3;
  CameraCommandKind kind = 4;
  optional string path = 5; // Required only for Import/Export, resolved on rig host.
  optional string preview_run_id = 6; // Required for Stop/Attach; matches current preview.
  ProcessIdentity preview_consumer = 7; // Required for Attach only; absent for Start.
}
message AcquisitionCameraCommand {
  BackendCommand command = 1;
  optional uint64 configuration_revision = 2;
  cephvr.acquisition.v1.CameraRole camera = 3;
  CameraCommandKind kind = 4;
  optional string path = 5;
  optional string preview_run_id = 6;
  cephvr.acquisition.v1.CameraDeviceConfiguration requested = 7;
  cephvr.acquisition.v1.CameraTransportSettings transport = 8;
  ProcessIdentity preview_consumer = 9; // Attach only; capture never requires a viewer.
  cephvr.acquisition.v1.AcquisitionFilePolicies file_policies = 10;
  optional uint32 preview_output_bit_depth = 11;
  AcquisitionSettings settings = 12; // Complete controller-accepted Configuration draft.
  // Supplied transport must equal this role's file policy; no alternative source.
  // Full controller-selected device settings, not an operator-to-device bypass.
}
message CameraSettingsApplication {
  cephvr.acquisition.v1.CameraRole camera = 1;
  cephvr.acquisition.v1.CameraDeviceConfiguration requested = 2;
  cephvr.acquisition.v1.CameraTransportSettings transport = 3;
}
message AcquisitionCameraSettingsCommand {
  BackendCommand command = 1;
  optional uint64 configuration_revision = 2;
  repeated CameraSettingsApplication cameras = 3;
  PulseSettingsApplication pulses = 4; // Combine related camera/pulse edits in one revision batch.
  cephvr.acquisition.v1.AcquisitionFilePolicies file_policies = 5;
  // Internal application after UpdateConfiguration validation, only for currently
  // owned editing/preview devices; offline edits must not open devices implicitly.
  // Batch changed roles under one revision so readback adoption stays atomic.
}
message PulseSettingsApplication {
  cephvr.acquisition.v1.CameraPulseConfiguration requested = 1;
  optional bool behavioral_active = 2;
  optional bool tracking_active = 3;
  reserved 4;
  reserved "watchdog_ms"; // Watchdog travels only in AcquisitionFilePolicies.serial_communication_timeout_ns.
}
message AcquisitionPulseCommand {
  BackendCommand command = 1;
  optional uint64 configuration_revision = 2;
  PulseSettingsApplication application = 3;
  cephvr.acquisition.v1.AcquisitionFilePolicies file_policies = 4;
  // Internal complete pulse-only update. Related camera edits use the combined
  // camera-settings command instead; never race two adoption batches for one edit.
  // No raw serial API or locked-session timing change.
}
message PreviewAttachmentQuery {
  string client_id = 1;
  string controller_generation = 2;
  ProcessIdentity consumer = 3;
  string preview_run_id = 4;
}
message PreviewAttachmentResult {
  bool available = 1;
  cephvr.acquisition.v1.FrameBufferAttachment attachment = 2;
  Failure failure = 3;
  optional bool release_only = 4; // Required when available; retired transfers are cleanup-only.
  // Only the authorized exact target receives its existing duplicated handles.
}
message PreviewAttachmentReport {
  BackendContext source = 1;
  OperationContext operation = 2;
  cephvr.acquisition.v1.FrameBufferAttachment attachment = 3;
  // Coordinator -> controller private cache; never Snapshot or session metadata.
}
enum PreviewConsumerResult {
  PREVIEW_CONSUMER_RESULT_UNSPECIFIED = 0;
  PREVIEW_CONSUMER_RESULT_ATTACHED = 1;
  PREVIEW_CONSUMER_RESULT_RELEASED = 2;
  PREVIEW_CONSUMER_RESULT_FAILED = 3;
}
message PreviewConsumerReport {
  string client_id = 1;
  string controller_generation = 2;
  ProcessIdentity consumer = 3;
  string preview_run_id = 4;
  string allocation_id = 5;
  string transfer_id = 6;
  PreviewConsumerResult result = 7;
  Failure failure = 8;
  // Consumer -> controller -> coordinator, authenticated per hop. A receipt is
  // not start permission; earlier cancellation/Stop cannot be undone by ATTACHED.
}
message CameraResolutionEntry {
  cephvr.acquisition.v1.CameraRole camera = 1;
  cephvr.acquisition.v1.CameraResolvedState result = 2;
}
message AcquisitionResolutionReport {
  BackendContext source = 1;
  WorkContext work = 2;
  OperationContext operation = 3; // Outstanding coordinator Setup/device command.
  optional uint64 requested_configuration_revision = 4;
  repeated CameraResolutionEntry cameras = 5;
  cephvr.acquisition.v1.PulseConfigurationResolution pulses = 6;
  // One complete expected batch, before allocation/restart/export; not Ready.
}
message AcquisitionConfigurationConfirmation {
  BackendCommand command = 1;
  OperationContext resolution_operation = 2;
  optional uint64 requested_configuration_revision = 3;
  optional uint64 confirmed_configuration_revision = 4;
  AcquisitionSettings confirmed = 5;
  cephvr.acquisition.v1.PulseConfigurationResolution confirmed_pulses = 6;
  // Exact adopted values for this live operation; never clears cancellation/locking.
}
message AcquisitionWarningReport {
  BackendContext source = 1; // Registered acquisition coordinator.
  AcquisitionWarningView view = 2; // Preserve original producer/scope/revision/counts.
}
message AcquisitionDeviceStatusReport {
  AcquisitionDeviceViews views = 1;
  WorkContext work = 2;
  OperationContext operation = 3;
  OperationState result = 4;
  optional string exported_pfs_path = 5; // Only after successful file close.
  // Separate command result from observed device state and from original errors.
}

message SnapshotRequest {
  // GUI/headless identity. Read-only access grants no operator lease.
  string client_id = 1;
}
message WatchRequest {
  string client_id = 1;
  reserved 2, 3;
  reserved "controller_generation", "after_cursor";
  string watch_id = 4; // Fresh per subscription; exact live stream used by ControlClaim.
  // Every subscription starts as observer with complete current state/configuration.
  // Duplicate live watch_id for the same authenticated client is rejected.
}
message OperatorCommand {
  OperatorContext operator = 1;
  string controller_generation = 2;
  WorkContext expected_work = 3; // Required for a command targeting allocated work.
}
message ControlClaim {
  string client_id = 1;
  string command_id = 2;
  string controller_generation = 3;
  optional string session_id = 4;
  uint64 synchronized_state_revision = 5;
  // No existing control_generation is required to claim unowned control/take over.
  string watch_id = 6; // Must name this client's live, synchronized WatchState stream.
  // AcquireControl requires unowned control; explicit TakeOverControl replaces a holder.
  // No recovery token, reconnect reservation or automatic replacement-GUI claim.
  // Revision must belong to this generation; skipped revisions need no replay.
  // Admission still revalidates current authority and lifecycle.
}
message UpdateConfigurationRequest {
  OperatorCommand command = 1;
  uint64 expected_revision = 2;
  ExperimentConfiguration proposed = 3;
  // Pure validation must finish successfully before commit. Unavailable/timeout/invalid
  // rejects with warning/field issues and leaves current settings/revision unchanged.
  // Recheck lease, expected revision and lock at commit; late results cannot apply.
}
message PromptResponse {
  OperatorCommand command = 1;
  string prompt_id = 2;
  SessionContext setup = 3;
  OperationContext setup_operation = 4;
  string choice = 5; // Must match a currently permitted choice exactly.
  optional uint64 expected_incident_revision = 6; // Required for runtime prompts.
  // Legacy setup/setup_operation identify the runtime session/incident operation.
  // Continue rejects changed scope/revision; AbortNow remains independently available.
}
message IncidentScopeRequest {
  BackendCommand command = 1;
  RuntimeIncident incident = 2;
  // Controller-authorized exact session/incident revision; only E06 confirmed
  // isolation scopes. No runtime config, device restart or evidence override.
  // Standard OperationState reports completion; admission alone is not proof.
}
message BackendCommand {
  string command_id = 1;
  ProcessIdentity issuer = 2; // Registered controller or authorized supervisor.
  BackendContext target = 3;
  WorkContext work = 4;
  OperationContext parent_operation = 5;
}
message SetupSessionRequest {
  BackendCommand command = 1;
  PreparedSession plan = 2; // Shared fields plus this target's settings/outputs only.
  BackendSettings settings = 3;
  cephvr.acquisition.v1.AcquisitionFilePolicies acquisition_policies = 4;
  cephvr.visual_stimulus.v1.VisualStimulusFilePolicies visual_stimulus_policies = 5; // Required only for Visual Stimulus.
  cephvr.tracking.v1.TrackingFilePolicies tracking_policies = 6; // Enabled tracking only.
  cephvr.visual_stimulus.v1.FeedbackAttachment feedback_attachment = 7; // Visual Stimulus closed-loop Setup only; protected metadata.
  ProcessIdentity feedback_consumer = 8; // Tracking closed-loop Setup: exact registered renderer child from supervisor status.
  // Backend file policies are file-resolved, never session/trial overrides.
}
message PrepareTrialRequest {
  BackendCommand command = 1;
  uint64 configuration_revision = 2;
  TrialPlan plan = 3;
  repeated OutputPlan outputs = 4;
  // Readiness/preparation only; no samples or trial-file writes before T.
}
message ScheduleTrialRequest {
  BackendCommand command = 1;
  int64 start_monotonic_ns = 2;
  int64 normal_end_monotonic_ns = 3;
  // Reject unless checked (end - start) equals retained TrialPlan.resolved_duration_ns
  // for this exact trial/configuration. Visual Stimulus also checks its actual resolved epoch sum.
  // No new duration is accepted through scheduling; release retains the same check.
  string trial_file_prefix = 4;
  repeated OutputPlan outputs = 5;
  // Acknowledging this target does NOT release execution.
}
message ReleaseTrialRequest {
  BackendCommand command = 1;
  OperationContext schedule_operation = 2;
  int64 start_monotonic_ns = 3;
  int64 normal_end_monotonic_ns = 4;
  // Must match the retained schedule exactly. Acceptance proves local validation
  // of release, not actual onset. Controller receipt must meet E05's cutoff too.
}
message StopTrialRequest {
  BackendCommand command = 1;
  int64 issued_monotonic_ns = 2;
  reserved 3;
  reserved "end_monotonic_ns";
  Failure reason = 4;
  // Normal end is already in the retained schedule. Abort requests prompt local
  // stopping; E11 producer evidence owns its cutoff. Issuance anchors deadlines.
}
message InterruptSessionRequest {
  BackendCommand command = 1;
  int64 issued_monotonic_ns = 2;
  Failure reason = 3;
  // Permanently fence this session; cancel release/preparation and close real outputs.
}
message BackendQuery {
  BackendContext target = 1;
  WorkContext work = 2;
}
message RetainedResultQuery {
  BackendQuery query = 1;
  string command_id = 2;
  reserved 3;
  reserved "operation_id";
}
message RetainedResult {
  bool found = 1;
  BackendContext backend = 2;
  WorkContext work = 3;
  CommandAdmission admission = 4;
  OperationState operation = 5;
  ReadyReport ready = 6;
  StartedReport started = 7;
  StoppedReport stopped = 8;
  FinishedReport finished = 9;
  repeated OutputResult outputs = 10;
  AcquisitionResolutionReport acquisition_resolution = 11;
  AcquisitionDeviceStatusReport acquisition_device_result = 12;
  DataPreparationReport data_preparation = 13; // Latest protected Setup handoff state, never a public snapshot.
  // Not-found never authorizes re-execution of an uncertain operation.
}
message RegisteredContext {
  ProcessIdentity controller = 1;
  ProcessIdentity supervisor = 2;
  WorkContext work = 3;
  OperationContext operation = 4;
  repeated BackendContext required_participants = 5;
  string session_directory = 6; // E04 session root; local outputs are under protocol-data/.
  repeated OutputPlan outputs = 7;
  ControlPolicies policies = 8;
  reserved 9;
  reserved "spikeglx_stop"; // No supervisor SpikeGLX fallback (E12).
  repeated RuntimeIncident continuation_incidents = 10;
  // Controller-retained E06 unavailable-function scopes, updated at session level when
  // a scope changes; supervisor verifies isolation and exact incident revisions.
  repeated PreparedFunctionScope prepared_functions = 11; // Exact validated Ready closures, including essential continuing paths.
  repeated ResourceObligation cleanup_resources = 12; // Exact Ready native release obligations; output closure remains separate.
  repeated CleanupCommandFence cleanup_commands = 13; // Append-only exact controller-issued cleanup admissions, registered before dispatch.
  optional bool paired_spikeglx = 14; // Frozen Setup fact: external SpikeGLX run is expected; absent is unknown.
  reserved 15;
}
message CleanupCommandFence {
  ProcessIdentity target = 1; // Top-level backend generation that will report Cleanup.
  WorkContext work = 2;
  OperationContext operation = 3; // Exact cleanup command ID; no authority from an arbitrary report ID.
}
message RegisterContextRequest {
  string command_id = 1;
  RegisteredContext context = 2;
}
message RegistrationReceipt {
  CommandAdmission admission = 1;
  RegisteredContext registered = 2; // Exact acknowledgement required before start.
  Failure failure = 3;
}
message ApplicationShutdownRequest {
  string command_id = 1;
  ProcessIdentity controller = 2;
  ProcessIdentity supervisor = 3;
  OperatorContext operator = 4; // Bound to the controller-authorized operator request.
  OperationContext controller_operation = 5;
  WorkContext work = 6; // Absent when no Setup/session has been allocated.
  int64 issued_monotonic_ns = 7;
  // Send immediately on accepted shutdown, not after cleanup. Same ID/request is
  // idempotent. Supervisor admission proves retained intent, not completed shutdown.
  // Exact registered controller authority; no unverified client shutdown forwarding.
  // Preserve existing cleanup/deadlines if controller fails after handoff.
}
message ProcessHealthStatus {
  ProcessIdentity process = 1;
  bool process_running = 2;
  bool connected = 3;
  string health = 4;
  optional int64 last_evidence_monotonic_ns = 5;
  string software_version = 6;
  repeated string capabilities = 7;
  string protocol_package = 8;
  // Supervisor-owned fields only: cannot overwrite Ready, trial phase or outputs.
  HeartbeatReport last_heartbeat = 9; // Exact source/work and typed E06 continuing-path facts; never inferred from health text.
  ProcessIdentity launch_owner = 10; // Exact registered immediate parent; controller derives backend-owned worker ancestry.
}
// Complete supervisor-owned projection; no delta/removal messages. See E08.
message SupervisorStatusReport {
  ProcessIdentity supervisor = 1;
  string controller_generation = 2;
  WorkContext work = 3; // Absent for application-level status with no allocated work.
  uint64 status_revision = 4; // Monotonic within this supervisor generation.
  int64 observed_monotonic_ns = 5;
  reserved 6;
  reserved "changes";
  repeated ProcessHealthStatus processes = 7;
  repeated ErrorReport errors = 8;
  repeated Warning warnings = 9;
  repeated RecoveryState recoveries = 10;
  repeated OperationState operations = 11;
  // Every list is the complete retained supervisor-owned projection, including empty.
  // Replace atomically; a newer full revision can skip predecessors. Same revision
  // must carry identical captured content/time. Lower revisions are ignored.
  // No controller lifecycle, Ready, output closure or incident-consent overwrite.
  // Dedicated urgent/results RPCs and retained evidence remain independently required.
}
message InterruptionReport {
  string interruption_id = 1; // Stable across redelivery of the same interruption.
  ProcessIdentity supervisor = 2;
  string controller_generation = 3;
  WorkContext work = 4;
  int64 issued_monotonic_ns = 5; // Original issuance; receipt never resets deadlines.
  Failure reason = 6;
  optional string triggering_error_id = 7;
  // Registered supervisor authority, not an operator lease or operator AbortNow.
  // Delivery is independent of direct backend interruption; receipt is not closure.
  // Exact context and idempotent handling; preactivation means unstarted cleanup.
}
message RecoveryQuery {
  ProcessIdentity expected_supervisor = 1;
  WorkContext work = 2;
  optional string prior_controller_generation = 3; // Startup E04 query only; current controller remains authenticated.
}
message PriorApplicationExitReceipt {
  string controller_generation = 1; // Prior application generation, never current-session authority.
  string supervisor_generation = 2; // Exact prior supervisor generation bound to unfinished pointer.
  int64 observed_monotonic_ns = 3; // Launcher observation after outer application job was empty.
  bool all_owned_processes_absent = 4; // Launcher writes true only after outer application Job membership is empty.
  uint32 format_version = 5; // Exact private record format; currently 1.
}
message RecoverySnapshot {
  ProcessIdentity supervisor = 1;
  int64 captured_monotonic_ns = 2;
  repeated RecoveryState recoveries = 3;
  repeated ParticipantState participants = 4;
  reserved 5;
  reserved "metadata"; // Controller-local writer; terminal evidence is controller_cleanup below.
  repeated OperationState operations = 6;
  repeated ErrorReport errors = 7;
  repeated Warning warnings = 8;
  repeated CleanupBlocker cleanup_blockers = 9;
  reserved 10;
  reserved "reservations"; // Controller-local output reservation (E04); Snapshot.reservation.
  uint64 status_revision = 11; // Capture revision; queries do not repair pushed-view gaps.
  reserved 12;
  reserved "controller_cleanup"; // Controller no longer reports Cleanup to supervisor.
  PriorApplicationExitReceipt prior_application_exit = 13; // Verified owner-private launcher receipt, only for an exact startup query.
}
enum RecoveryAction {
  RECOVERY_ACTION_UNSPECIFIED = 0;
  RECOVERY_ACTION_RETRY_GRACEFUL_CLEANUP = 1;
  reserved 2, 3;
  reserved "RECOVERY_ACTION_TERMINATE_PROCESS", "RECOVERY_ACTION_RESTART_BACKEND";
  // A stuck process is resolved by ShutdownApplication (E06).
}
message RecoveryActionRequest {
  string command_id = 1;
  ProcessIdentity supervisor = 2;
  ProcessIdentity target = 3;
  WorkContext work = 4;
  RecoveryAction action = 5;
  OperatorContext operator = 6;
  reserved 7;
  reserved "confirmation_id";
  // Authority: controller-verified current control lease only. Controller loss is
  // full application shutdown (E08), so there is no supervisor-local fallback.
}
// E08: the initiating PlanLaunch command is the launch's stable identifier.
// These internal records/OS handles never enter public snapshots or session logs.
message PlanLaunchRequest {
  string command_id = 1;
  ProcessIdentity owner = 2;
  ProcessIdentity child = 3;
  WorkContext work = 4;
  OperationContext parent_operation = 5;
  string executable = 6;
  bool python_worker = 7;
  string stop_method = 8; // grpc_shutdown or owner_stdin_eof; exact role validation.
}
message ConfirmLaunchRequest {
  string command_id = 1;
  string launch_command_id = 2;
  ProcessIdentity owner = 3;
  ProcessIdentity child = 4;
  optional uint32 pid = 5;
  optional uint64 creation_time_100ns = 6; // Windows process FILETIME identity.
  optional string endpoint = 7; // Python bootstrap confirmation only; loopback.
  optional bool creation_failed_without_child = 8;
  Failure failure = 9;
  HostClockDescriptor host_clock = 10; // Required on Python endpoint confirmation.
  // OS evidence precedes resume; endpoint and matching clock precede operational work.
}
message LaunchQuery {
  ProcessIdentity requester = 1;
  string launch_command_id = 2;
}
enum LaunchPhase {
  LAUNCH_PHASE_UNSPECIFIED = 0;
  LAUNCH_PHASE_PLANNED = 1;
  LAUNCH_PHASE_OS_CONFIRMED = 2;
  LAUNCH_PHASE_OPERATIONAL = 3;
  LAUNCH_PHASE_CLEANUP_REQUIRED = 4;
  LAUNCH_PHASE_RELEASED = 5;
}
message LaunchState {
  PlanLaunchRequest plan = 1;
  LaunchPhase phase = 2;
  string containment_job_name = 3;
  optional uint32 pid = 4;
  optional uint64 creation_time_100ns = 5;
  optional string endpoint = 6;
  Failure failure = 7;
  HostClockDescriptor host_clock = 8; // Retained Python compatibility evidence.
  // No released state without verified process/descendant exit and obligations met.
}
message LaunchReceipt {
  CommandAdmission admission = 1;
  LaunchState state = 2;
}


// Setup dependency handoffs under contracts/data-preparation.md. Metadata only;
// reports precede final Ready and never authorize execution. Not public GUI data.
message DataPreparationReport {
  ReportContext source = 1; // Exact registered backend/session/original Setup operation.
  uint64 configuration_revision = 2;
  uint64 report_revision = 3; // Positive, increasing within this backend's Setup operation.
  oneof payload {
    cephvr.acquisition.v1.FrameBufferAttachment tracking_input = 4;
    cephvr.tracking.v1.TrackingPreparationState tracking = 5;
  }
}
message TrackingInputConfirmation {
  BackendCommand command = 1; // Controller -> acquisition, current Setup parent.
  uint64 configuration_revision = 2;
  oneof evidence {
    DataPreparationReport tracking_evidence = 3; // Exact validated tracking report; no reconstructed acknowledgment.
    CleanupReport tracking_cleanup = 4; // Exact accepted tracking cleanup proof for release of the bound input transfer.
  }
}
