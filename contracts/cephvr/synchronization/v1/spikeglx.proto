syntax = "proto3";
package cephvr.synchronization.v1;

// E12 controller-owned client; see spikeglx-control.md.
// No remote CephVR service: the controller calls SpikeGLX's own command server.
// Imports nothing from control.v1, so control.v1 may import this file one-way.

enum PulseRole {
  PULSE_ROLE_UNSPECIFIED = 0;
  PULSE_ROLE_BEHAVIORAL_CAMERA = 1;
  PULSE_ROLE_TRACKING_CAMERA = 2;
  PULSE_ROLE_PHOTODIODE = 3;
}
enum StreamFamily {
  STREAM_FAMILY_UNSPECIFIED = 0;
  STREAM_FAMILY_NI = 1;     // Native js code 0 (mapping reference).
  STREAM_FAMILY_ONEBOX = 2; // Native js code 1.
  STREAM_FAMILY_IMEC = 3;   // Native js code 2.
}
message PulseChannel {
  PulseRole role = 1;
  StreamFamily family = 2; // Camera roles require ONEBOX.
  uint32 stream_index = 3;
  uint32 channel_index = 4; // Saved acquisition index; must be in saved_channel_indices.
  optional uint32 bit = 5;  // Digital line within a word channel, when applicable.
}
message NativeStream {
  StreamFamily family = 1;
  uint32 index = 2;
  optional string hardware_serial = 3;
  double sample_rate_hz = 4;
  repeated uint32 acquired_channel_counts = 5;
  repeated uint32 saved_channel_indices = 6;
}
// Setup readback recorded in SESSION_CONFIG.json; not an acquisition profile to apply.
message SpikeGLXPreparation {
  string spikeglx_version = 1;
  string sdk_version = 2;
  string mapping_id = 3;
  string run_name = 4;       // Managed name, read back after setRunName.
  string data_directory = 5; // getDataDir readback; ephys-host path, never opened by the rig.
  repeated NativeStream streams = 6;
  string gate_mode = 7;
  string trigger_mode = 8;
  repeated PulseChannel pulse_channels = 9;
  string address = 10; // Exact configured command-server address used for this prepared session.
  uint32 port = 11; // Exact configured command-server port; require 1..65535.
}
enum SpikeGLXRecordingPhase {
  SPIKEGLX_RECORDING_PHASE_UNSPECIFIED = 0;
  SPIKEGLX_RECORDING_PHASE_NOT_STARTED = 1;
  SPIKEGLX_RECORDING_PHASE_STARTING = 2; // startRun issued; writing gate pending.
  SPIKEGLX_RECORDING_PHASE_WRITING = 3;  // Writing gate passed; progress monitored.
  SPIKEGLX_RECORDING_PHASE_STOPPING = 4;
  SPIKEGLX_RECORDING_PHASE_STOPPED = 5;  // isRunning false observed; native finalization delegated.
  SPIKEGLX_RECORDING_PHASE_UNKNOWN = 6;  // Uncertain mutation or unreachable server; not alone fatal during J1 tolerance.
}
message StreamProgress {
  StreamFamily family = 1;
  uint32 index = 2;
  uint64 sample_count = 3;
  optional int64 last_progress_monotonic_ns = 4;
  // Controller-maintained time of this stream's last confirmed count advance.
  // Retained through failed observations/reconnect; other streams cannot renew it.
}
// Current controller view; rig host-clock observations only. UNKNOWN carries no
// fresh running/saving claim; retained stream progress remains historical evidence.
message SpikeGLXRecordingView {
  SpikeGLXRecordingPhase phase = 1;
  optional bool running = 2;
  optional bool saving = 3;
  optional bool run_name_matches = 4;
  repeated StreamProgress progress = 5;
  optional int64 observed_monotonic_ns = 6;
  optional string failure_code = 7;
  // No native CLOSED, checksum, transfer or pulse-recorded field.
}
