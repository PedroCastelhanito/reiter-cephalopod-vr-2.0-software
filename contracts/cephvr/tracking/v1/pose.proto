syntax = "proto3";
package cephvr.tracking.v1;

// T10/T21. Shared geometry; contracts/tracking/pose.md owns anatomical field aliases.
// Selected acquisition image pixel centres: origin top-left, +x right, +y down.
// Every coordinate is required, finite and in [0,width-1] / [0,height-1].
message ImagePoint {
  optional double x_px = 1;
  optional double y_px = 2;
}
message PoseLandmarks {
  ImagePoint tip = 1; // Posterior mantle tip.
  ImagePoint left_base = 2; // Left anterior mantle tip (animal-left).
  ImagePoint right_base = 3; // Right anterior mantle tip (animal-right).
}
message ManualPoseSettings {
  optional uint32 image_width_px = 1; // Required positive, matches prepared source.
  optional uint32 image_height_px = 2; // Required positive, matches prepared source.
  PoseLandmarks landmarks = 3; // All named points required; no zero sentinel.
}

// T16: pixel-index rectangle, right/bottom exclusive. All fields required.
// x/y may be zero; width/height must be positive. Must fit prepared acquired image.
message PoseSearchRegion {
  optional uint32 x_px = 1;
  optional uint32 y_px = 2;
  optional uint32 width_px = 3;
  optional uint32 height_px = 4;
}

// T18: intensity range is prepared grayscale's effective native code range.
enum ForegroundPolarity {
  FOREGROUND_POLARITY_UNSPECIFIED = 0;
  FOREGROUND_POLARITY_DARK = 1; // intensity <= level.
  FOREGROUND_POLARITY_BRIGHT = 2; // intensity > level.
}
message ThresholdSegmentationSettings {
  optional double level = 1; // Required finite and within declared intensity range.
  optional ForegroundPolarity polarity = 2; // Required non-UNSPECIFIED.
}

// T20: four labelled setup annotations, not a replacement for PoseLandmarks.
// All points/dimensions required when this reference is supplied. Positions use
// the acquired-image pixel-centre convention and exact prepared source dimensions.
message SubjectReferenceSettings {
  optional uint32 image_width_px = 1;
  optional uint32 image_height_px = 2;
  ImagePoint anterior = 3; // Toward the head; not an asserted head centre/pivot.
  ImagePoint posterior = 4; // Toward the mantle tip.
  ImagePoint medial_left = 5; // Toward animal-left, not screen-left.
  ImagePoint medial_right = 6; // Toward animal-right, not screen-right.
}

// T29: optional acquired-image preprocessing; preserve source pixel coordinates.
message TrackingPreprocessingSettings {
  optional bool crop_enabled = 1;
  PoseSearchRegion crop_region = 2;
  optional uint32 scale_percent = 3; // 100 means no downscale.
}

// T29: calibration evidence for the selected source image, independent of downscale.
message TrackingImageScale {
  optional uint32 image_width_px = 1;
  optional uint32 image_height_px = 2;
  ImagePoint distance_start = 3;
  ImagePoint distance_end = 4;
  optional double distance_mm = 5;
  optional double pixels_per_mm = 6;
}
